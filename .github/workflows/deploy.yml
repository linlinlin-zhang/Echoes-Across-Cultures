name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /root/workspace/Echoes-Across-Cultures

            echo "=== Pulling latest changes ==="
            nice -n 19 ionice -c3 git pull --ff-only

            echo "=== Installing Python dependencies (low priority) ==="
            nice -n 19 ionice -c3 .venv/bin/pip install \
              -r requirements.txt \
              --quiet \
              --prefer-binary \
              --no-compile

            echo "=== Restarting service ==="
            systemctl restart echo.service

            echo "=== Verifying service status ==="
            sleep 2
            systemctl is-active echo.service

            echo "=== Deploy complete ==="
