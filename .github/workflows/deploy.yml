name: Deploy to Production

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty for current branch)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Determine branch
        id: branch
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "ref=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /srv/echo

            echo "=== Deploying branch: ${{ steps.branch.outputs.ref }} ==="

            echo "=== Fetching latest changes ==="
            git fetch origin

            echo "=== Checking out branch ==="
            git checkout ${{ steps.branch.outputs.ref }}

            echo "=== Pulling latest changes ==="
            git pull --ff-only origin ${{ steps.branch.outputs.ref }}

            echo "=== Installing Python dependencies (cloud only) ==="
            .venv/bin/pip install \
              -r requirements-cloud.txt \
              --quiet \
              --prefer-binary \
              --no-compile

            echo "=== Restarting service ==="
            systemctl restart echo.service

            echo "=== Verifying service status ==="
            sleep 2
            systemctl is-active echo.service

            echo "=== Deploy complete ==="
            echo "=== Deployed branch: ${{ steps.branch.outputs.ref }} ==="
