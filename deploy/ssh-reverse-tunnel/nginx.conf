server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name resonance.website www.resonance.website _;
    ssl_certificate /etc/letsencrypt/live/resonance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resonance/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/echo-exhibition/current/web;
    index index.html;
    include /etc/nginx/snippets/echo-security-headers.conf;
    client_max_body_size 1m;
    proxy_read_timeout 300s;
    client_body_timeout 120s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn echo_connections_ip 160;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css application/javascript application/json image/svg+xml;
    access_log /var/log/nginx/echo.access.log;
    error_log /var/log/nginx/echo.error.log warn;

    location ~ /\. { return 404; }
    location ~ ^/(docs|redoc|openapi\.json|prototype|pal)(/|$) { return 404; }

    location ^~ /__echo_audio/ {
        internal;
        alias /srv/echo/cloud_audio_10gb/;
        include /etc/nginx/snippets/echo-security-headers.conf;
        add_header X-Echo-Edge cloud-audio always;
        add_header Cache-Control "public, max-age=604800";
        limit_except GET { deny all; }
    }

    location ~ ^/api/(edge/health|mainline/(status|cultures|catalog|random|tracks/[A-Za-z0-9_-]+|audio/[A-Za-z0-9_-]+))$ {
        limit_req zone=echo_api_ip burst=160 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://echo_readonly;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_buffering on;
    }

    location = /api/mainline/upload_recommend {
        limit_except POST { deny all; }
        limit_req zone=echo_compute_rate burst=30 nodelay;
        limit_conn echo_compute_connections 32;
        client_max_body_size 210m;
        proxy_request_buffering on;
        include /etc/nginx/snippets/echo-origin-proxy.conf;
    }

    location = /api/mainline/recommend {
        limit_except POST { deny all; }
        limit_req zone=echo_compute_rate burst=30 nodelay;
        limit_conn echo_compute_connections 32;
        include /etc/nginx/snippets/echo-origin-proxy.conf;
    }

    location ~ ^/api/ai/kimi/chat(/stream)?$ {
        limit_except POST { deny all; }
        limit_req zone=echo_ai_rate burst=20 nodelay;
        proxy_buffering off;
        include /etc/nginx/snippets/echo-origin-proxy.conf;
    }

    location = /api/health {
        include /etc/nginx/snippets/echo-origin-proxy.conf;
        proxy_read_timeout 5s;
    }

    location ~ ^/api/(session|favorites(/.*)?|mainline/upload_formats|ai/kimi/status)$ {
        limit_req zone=echo_api_ip burst=160 nodelay;
        include /etc/nginx/snippets/echo-origin-proxy.conf;
    }

    location = /api/files/download {
        if ($arg_path !~* "^uploads(/|%2f)mainline(/|%2f)(raw|compressed|covers)(/|%2f)[0-9a-f]{32}_[^/]*\.(mp3|m4a|mp4|aac|wav|wave|flac|ogg|oga|opus|webm|aif|aiff|wma|jpg|jpeg|png)$") { return 404; }
        if ($arg_path ~* "(\.\.|%2e|%5c)") { return 404; }
        if ($arg_path ~ "\\\\") { return 404; }
        limit_except GET { deny all; }
        include /etc/nginx/snippets/echo-origin-proxy.conf;
    }

    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/echo-security-headers.conf;
        add_header X-Echo-Edge cloud-static always;
        add_header Cache-Control no-cache;
        limit_except GET { deny all; }
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name resonance.website www.resonance.website _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; try_files $uri =404; }
    location / { return 301 https://resonance.website$request_uri; }
}
