# HTTP context, unique names scoped to Echo; other hosted sites are unaffected.
upstream echo_origin {
    server 127.0.0.1:18020 max_fails=1 fail_timeout=15s;
    server 127.0.0.1:18021 backup;
    keepalive 32;
}
upstream echo_readonly {
    server 127.0.0.1:18030 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:18020 backup;
    server 127.0.0.1:18021 backup;
    keepalive 32;
}
limit_req_zone $binary_remote_addr zone=echo_api_ip:2m rate=40r/s;
limit_req_zone $server_name zone=echo_compute_rate:1m rate=60r/m;
limit_req_zone $server_name zone=echo_ai_rate:1m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=echo_connections_ip:2m;
limit_conn_zone $server_name zone=echo_compute_connections:1m;
