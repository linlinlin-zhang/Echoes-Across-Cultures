    const countryLookupCacheKey = "echo-track-country-cache";
    const countryLookupInFlight = new Map();

    function readCountryLookupCache() {
      try {
        const data = JSON.parse(localStorage.getItem(countryLookupCacheKey) || "{}");
        return data && typeof data === "object" ? data : {};
      } catch (error) {
        return {};
      }
    }

    function writeCountryLookupCache(cache) {
      try {
        localStorage.setItem(countryLookupCacheKey, JSON.stringify(cache));
      } catch (_) { /* storage full or private mode */ }
    }

    function trackCountryKey(item) {
      return String(item.trackId || `${item.title}::${item.artist}::${item.album}`).trim();
    }

    function shouldLookupCountry(item) {
      if (!item || !item.needsCountryLookup) return false;
      if (item.geoLookupStatus === "resolved" || item.geoLookupStatus === "unresolved") return false;
      if (item.country && item.country !== mysteryPlace.country) return false;
      return Boolean(item.title || item.artist || item.platformTrackUrl || item.fullTrackUrl);
    }

    function countryFromIsoOrName(country, iso) {
      const code = isoCodeForCountryName(iso) || isoCodeForCountryName(country);
      return {
        code,
        name: countryNameLookupFn(code) || cleanMetaText(country)
      };
    }

    function applyCountryLookupResult(item, result) {
      if (!item || !result?.resolved) {
        if (item) {
          item.geoLookupStatus = "unresolved";
          item.needsCountryLookup = false;
        }
        return false;
      }
      const { code, name } = countryFromIsoOrName(result.country, result.country_iso);
      const capital = localizedCapital(code);
      const lat = Number(result.lat);
      const lng = Number(result.lng);
      if (!name || !Number.isFinite(lat) || !Number.isFinite(lng)) {
        item.geoLookupStatus = "unresolved";
        item.needsCountryLookup = false;
        return false;
      }
      item.country = name;
      item.city = capital?.city || cleanMetaText(result.capital) || name;
      item.lat = lat;
      item.lng = lng;
      item.locationPrecision = t("music.precision.capitalCity");
      item.needsCountryLookup = false;
      item.geoLookupStatus = "resolved";
      item.raw = {
        ...(item.raw || {}),
        ai_country_location: {
          country: result.country,
          country_iso: code || result.country_iso || "",
          capital: result.capital || item.city,
          confidence: result.confidence,
          source: result.source || "kimi_web_search"
        }
      };
      return true;
    }

    function applyCountryLookupToMatchingTracks(sourceItem, result) {
      const sourceKey = trackCountryKey(sourceItem);
      const targets = [primaryTrack, currentTrack, ...recommendations, ...activeRecommendations]
        .filter(Boolean)
        .filter((item, index, all) => all.indexOf(item) === index)
        .filter((item) => trackCountryKey(item) === sourceKey || isSameTrack(item, sourceItem));
      let currentChanged = false;
      targets.forEach((target) => {
        const changed = applyCountryLookupResult(target, result);
        currentChanged = currentChanged || (changed && isSameTrack(target, currentTrack));
      });
      if (currentChanged) {
        centerLng = currentTrack.lng;
        centerLat = currentTrack.lat;
        syncTrackReadouts();
      }
      renderRecommendations();
      drawMap();
      persistLastStartupTrack();
      persistMusicStationState();
    }

    function applyCachedCountryLocations(items) {
      const cache = readCountryLookupCache();
      items.filter(Boolean).forEach((item) => {
        const key = trackCountryKey(item);
        const cached = key ? cache[key] : null;
        if (!cached) return;
        if (cached.resolved) {
          applyCountryLookupResult(item, cached);
        } else {
          item.geoLookupStatus = "unresolved";
          item.needsCountryLookup = false;
        }
      });
    }

    async function requestKimiTrackCountry(item) {
      const config = getKimiConfig();
      const payload = {
        model: config.model,
        endpoint: config.endpoint,
        track_id: item.trackId || "",
        title: item.title || "",
        artist: item.artist || "",
        album: item.album || "",
        city: item.originalCity || (item.country === mysteryPlace.country ? "" : item.city || ""),
        location: item.originalLocation || "",
        label: item.label || item.genre || "",
        tags: item.tags || "",
        culture: item.culture || "",
        source_dataset: item.sourceDataset || "",
        platform: item.platform || "",
        platform_track_url: item.platformTrackUrl || item.fullTrackUrl || "",
        release_year: item.releaseYear || null,
        timeout_seconds: 45
      };
      if (config.apiKey) {
        payload.api_key = config.apiKey;
      }
      const response = await fetch("/api/ai/kimi/track-country", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        return { ok: false, resolved: false, reason: `http_${response.status}` };
      }
      return response.json();
    }

    async function hydrateTrackCountries(items) {
      const unique = [];
      const seen = new Set();
      items.filter(Boolean).forEach((item) => {
        const key = trackCountryKey(item);
        if (!key || seen.has(key)) return;
        seen.add(key);
        unique.push(item);
      });
      applyCachedCountryLocations(unique);
      const missing = unique.filter(shouldLookupCountry);
      if (!missing.length) return;
      const canUseKimi = await canUseKimiDescriptions();
      if (!canUseKimi) return;

      const cache = readCountryLookupCache();
      for (const item of missing) {
        const key = trackCountryKey(item);
        if (!key) continue;
        if (!countryLookupInFlight.has(key)) {
          item.geoLookupStatus = "querying";
          countryLookupInFlight.set(
            key,
            requestKimiTrackCountry(item)
              .catch((error) => ({ ok: false, resolved: false, reason: kimiErrorMessage(error) }))
              .finally(() => countryLookupInFlight.delete(key))
          );
        }
        const result = await countryLookupInFlight.get(key);
        const cacheValue = result?.resolved
          ? result
          : { resolved: false, confidence: Number(result?.confidence || 0), reason: result?.reason || "unresolved" };
        cache[key] = cacheValue;
        writeCountryLookupCache(cache);
        applyCountryLookupToMatchingTracks(item, cacheValue);
      }
    }

    function applyCachedDescriptions(items) {
      const cache = readDescriptionCache();
      items.forEach((item) => {
        const key = descriptionKey(item);
        if (!metadataDescription(item) && key && cache[key]) {
          item.aiDescription = cache[key];
        }
      });
    }

    function descriptionPrompt(item) {
      const responseLanguage = aiResponseLanguageName();
      return `请使用 ${responseLanguage} 为这首音乐写一段简短介绍，1-2 句即可。

要求：
- 优先基于曲名、艺术家、专辑、流派、文化域、标签和平台来源来写。
- 如果无法确认真实背景，不要编造具体发行故事、奖项、歌词或听后细节。
- 语气适合音乐推荐卡片，具体但克制。

曲目信息：
曲名：${item.title || ""}
艺术家：${item.artist || ""}
专辑：${item.album || ""}
${t("music.desc.genre")}：${[item.label, item.tags].filter(Boolean).join(" / ")}
${t("music.desc.culture")}：${cultureLabel(item.culture) || item.culture || ""}
国家/城市：${[item.country, item.city].filter(Boolean).join(" / ")}
${t("music.readout.source")}：${item.sourceDataset || item.platform || ""}`;
    }

    async function generateKimiDescription(item) {
      const content = await requestKimi(
        [
          {
            role: "system",
            content: `You are Echo's music description writer. Use ${aiResponseLanguageName()}. Only output the music introduction text — no titles, bullet points, or disclaimers.`
          },
          {
            role: "user",
            content: descriptionPrompt(item)
          }
        ],
        { maxCompletionTokens: 1024 }
      );
      return conciseText(content, 320);
    }

    async function hydrateRecommendationDescriptions(items) {
      const run = ++descriptionHydrationRun;
      const missing = items.filter((item) => !metadataDescription(item) && !item.aiDescription);
      if (!missing.length) return;
      const canUseKimi = await canUseKimiDescriptions();
      if (run !== descriptionHydrationRun) return;
      if (!canUseKimi) {
        missing.forEach((item) => {
          item.descriptionLoading = false;
        });
        renderRecommendations();
        return;
      }

      missing.forEach((item) => {
        item.descriptionLoading = true;
      });
      renderRecommendations();

      const cache = readDescriptionCache();
      for (let start = 0; start < missing.length; start += 3) {
        const chunk = missing.slice(start, start + 3);
        const results = await Promise.allSettled(chunk.map((item) => generateKimiDescription(item)));
        if (run !== descriptionHydrationRun) return;
        results.forEach((result, index) => {
          const item = chunk[index];
          item.descriptionLoading = false;
          if (result.status === "fulfilled" && result.value) {
            item.aiDescription = result.value;
            const key = descriptionKey(item);
            if (key) cache[key] = result.value;
            if (window.EchoFavoriteStore?.isFavorite(item)) {
              window.EchoFavoriteStore.add(item);
            }
          }
        });
        writeDescriptionCache(cache);
        renderRecommendations();
        persistMusicStationState();
      }
    }

    async function streamAiAssistantReply(requestMessages, thinkingMode) {
      const mode = normalizeAiMode(thinkingMode);
      const assistantMessage = {
        role: "assistant",
        content: "",
        reasoningContent: "",
        thinkingMode: mode,
        reasoningOpen: mode === "thinking",
        isStreaming: true
      };
      aiConversationMessages.push(assistantMessage);
      renderAiMessages();

      try {
        const result = await requestKimiStream(
          requestMessages,
          { thinkingMode: mode },
          {
            onReasoning(reasoningContent) {
              assistantMessage.reasoningContent = reasoningContent;
              scheduleAiMessagesRender();
            },
            onContent(content) {
              assistantMessage.content = content;
              scheduleAiMessagesRender();
            }
          }
        );
        assistantMessage.content = result.content;
        assistantMessage.reasoningContent = result.reasoningContent || assistantMessage.reasoningContent;
        assistantMessage.isStreaming = false;
        renderAiMessages();
        persistMusicStationState();
        return assistantMessage;
      } catch (error) {
        assistantMessage.isStreaming = false;
        if (!assistantMessage.content && !assistantMessage.reasoningContent) {
          aiConversationMessages = aiConversationMessages.filter((message) => message !== assistantMessage);
        }
        renderAiMessages();
        throw error;
      }
    }

    async function runAiAnalysis(extraQuestion = "") {
      if (aiBusy) return;
      const selectedMode = normalizeAiMode(aiMode);
      setAiBusy(true);
      aiConversationMessages = [
        {
          role: "system",
          content: `You are a friend who loves world music, helping the user understand the playlist Echo recommended. Your style is warm, natural, conversational — like a music-savvy friend chatting. Respond in ${aiResponseLanguageName()}.

Guidelines:
- Explain in everyday language, avoid academic jargon or paper-like tone.
- If mentioning parameters, translate them into everyday feelings (e.g., "high serendipity" → "you might not expect to like this style").
- Each song introduction should be fun, like recommending to a friend, not a thesis abstract.
- Feel free to add interesting trivia about local music culture.`
        },
        {
          role: "user",
          content: buildAiInitialPrompt(extraQuestion),
          displayContent: buildAiDisplayPrompt(extraQuestion)
        }
      ];
      renderAiMessages();

      try {
        await streamAiAssistantReply(aiConversationMessages.slice(), selectedMode);
      } catch (error) {
        addAiNotice(kimiErrorMessage(error));
      } finally {
        setAiBusy(false);
      }
    }

    async function sendAiFollowup() {
      const question = els.aiQuestion.value.trim();
      if (!question || aiBusy) return;
      els.aiQuestion.value = "";

      if (!aiConversationMessages.length) {
        await runAiAnalysis(question);
        return;
      }

      setAiBusy(true);
      aiConversationMessages.push({ role: "user", content: question });
      renderAiMessages();

      try {
        await streamAiAssistantReply(aiConversationMessages.slice(), aiMode);
      } catch (error) {
        addAiNotice(kimiErrorMessage(error));
      } finally {
        setAiBusy(false);
      }
    }

    function resetAiConversation() {
      aiConversationMessages = [];
      renderAiMessages();
    }

    function syncTrackReadouts() {
      els.topTitle.textContent = currentTrack.title;
      els.topMeta.textContent = currentTrack.artist || t("music.default.unknown");
      els.playState.textContent = playbackTrackLabel(currentTrack);
      els.readoutTrack.textContent = currentTrack.title;
      els.readoutOrigin.textContent = formatOrigin(currentTrack);
      els.readoutStyle.textContent = displayGenre(currentTrack);
      if (els.readoutSource) {
        els.readoutSource.textContent = displaySource(currentTrack);
      }
      syncTopCover();
    }

    function createFallbackWorldFeatures() {
      const polygon = (name, coordinates) => ({
        type: "Feature",
        properties: { name },
        geometry: {
          type: "Polygon",
          coordinates: [coordinates]
        }
      });

      return {
        type: "FeatureCollection",
        features: [
          polygon("North America", [[-168, 72], [-52, 72], [-52, 16], [-82, 7], [-124, 24], [-168, 50], [-168, 72]]),
          polygon("South America", [[-82, 12], [-34, 8], [-44, -55], [-74, -55], [-82, 12]]),
          polygon("Greenland", [[-74, 82], [-12, 80], [-20, 60], [-58, 58], [-74, 82]]),
          polygon("Europe", [[-12, 72], [45, 72], [62, 36], [24, 34], [-12, 36], [-12, 72]]),
          polygon("Africa", [[-18, 36], [52, 34], [48, -35], [18, -36], [-18, 4], [-18, 36]]),
          polygon("Asia", [[42, 76], [180, 70], [180, 8], [106, -10], [72, 7], [42, 30], [42, 76]]),
          polygon("Australia", [[112, -10], [154, -10], [154, -44], [112, -44], [112, -10]]),
          polygon("Oceania", [[156, -2], [178, -8], [174, -24], [150, -18], [156, -2]]),
          polygon("Antarctica", [[-180, -64], [180, -64], [180, -84], [-180, -84], [-180, -64]])
        ]
      };
    }

    function updateProjection() {
      const scale = Math.min(width, height) * 0.82 * mapZoom;
      projection = d3.geoMercator()
        .center([centerLng, centerLat])
        .scale(scale)
        .translate([width / 2, height / 2]);
      path = d3.geoPath(projection);
    }

    function projectedPoint(item) {
      const point = projection([item.lng, item.lat]);
      if (!point) return { x: NaN, y: NaN };
      return { x: point[0], y: point[1] };
    }

    function clearLabels() {
      els.mapUi.querySelectorAll(".map-label").forEach((label) => label.remove());
    }

    function addLabel(item, className, index = -1) {
      const pos = projectedPoint(item);
      if (!Number.isFinite(pos.x) || !Number.isFinite(pos.y)) return;
      const label = document.createElement("div");
      label.className = `map-label ${className}`;
      if (className.includes("is-recommendation") && isSameTrack(item, currentTrack)) {
        label.classList.add("is-selected");
      }
      label.style.left = `${pos.x}px`;
      label.style.top = `${pos.y}px`;
      label.style.fontSize = `${(0.74 * mapZoom).toFixed(2)}rem`;
      if (index >= 0) {
        label.dataset.recIndex = String(index);
        label.setAttribute("role", "button");
        label.tabIndex = 0;
        label.setAttribute("aria-label", `${t("music.recommend.start")} ${item.title}`);
      }
      const placeLabel = item.country === mysteryPlace.country ? t("music.mysteryPlace.country") : (item.city || item.country);
      const styleLabel = item.country === mysteryPlace.country ? item.city : displayGenre(item);
      label.innerHTML = `${escapeHtml(placeLabel)}<br>${escapeHtml(styleLabel)}`;
      label.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      label.addEventListener("click", (event) => {
        if (index < 0) return;
        event.stopPropagation();
        selectTrack(activeRecommendations[index], { autoplay: true });
      });
      label.addEventListener("keydown", (event) => {
        if (index < 0 || (event.key !== "Enter" && event.key !== " ")) return;
        event.preventDefault();
        selectTrack(activeRecommendations[index], { autoplay: true });
      });
      els.mapUi.appendChild(label);
    }

    function pathFromLngLat(points) {
      const projected = points
        .map(([lng, lat]) => projection([lng, lat]))
        .filter((point) => point && Number.isFinite(point[0]) && Number.isFinite(point[1]));
      if (projected.length < 2) return "";
      return projected.map((point, index) => `${index ? "L" : "M"}${point[0].toFixed(2)},${point[1].toFixed(2)}`).join(" ");
    }

    function drawMap() {
      if (!worldFeatures) return;
      updateProjection();

      const svg = d3.select(els.mapSvg);
      svg.attr("viewBox", `0 0 ${width} ${height}`);
      svg.selectAll("*").remove();

      svg.append("g")
        .selectAll("path")
        .data(worldFeatures.features)
        .join("path")
        .attr("d", path)
        .attr("fill", "rgba(17, 17, 17, 0.035)")
        .attr("stroke", "rgba(17, 17, 17, 0.10)")
        .attr("stroke-width", 0.55);

      if (borders) {
        svg.append("path")
          .datum(borders)
          .attr("d", path)
          .attr("fill", "none")
          .attr("stroke", "rgba(17, 17, 17, 0.16)")
          .attr("stroke-width", 0.55);
      }

      svg.append("g")
        .attr("aria-label", t("music.aria.scsLine"))
        .selectAll("path")
        .data(southChinaSeaNineDashSegments)
        .join("path")
        .attr("d", pathFromLngLat)
        .attr("fill", "none")
        .attr("stroke", "rgba(17, 17, 17, 0.48)")
        .attr("stroke-width", 1.1)
        .attr("stroke-linecap", "round");

      clearLabels();
      addLabel(currentTrack, "is-current");
      activeRecommendations.forEach((item, index) => addLabel(item, "is-recommendation", index));
    }

    function drawStar(ctx, x, y, inner, outer, alpha, color) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      const points = 8;
      for (let i = 0; i < points; i += 1) {
        const angle = (i * Math.PI) / (points / 2) - Math.PI / points;
        const radius = i % 2 === 0 ? outer : inner;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function drawCanvas(time) {
      const ctx = els.mapCanvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      if (!projection) {
        requestAnimationFrame(drawCanvas);
        return;
      }

      const current = projectedPoint(currentTrack);
      if (!Number.isFinite(current.x) || !Number.isFinite(current.y)) {
        requestAnimationFrame(drawCanvas);
        return;
      }
      const elapsed = time * 0.001;

      if (activeRecommendations.length) {
        activeRecommendations.forEach((item, index) => {
          const target = projectedPoint(item);
          if (!Number.isFinite(target.x) || !Number.isFinite(target.y)) return;
          const offset = Math.sin(elapsed * 1.2 + index) * 10;
          ctx.save();
          ctx.setLineDash([5, 10]);
          ctx.lineDashOffset = -(elapsed * 22 + index * 4);
          ctx.beginPath();
          ctx.moveTo(current.x, current.y);
          const midX = (current.x + target.x) / 2;
          const midY = (current.y + target.y) / 2 - 45 - offset;
          ctx.quadraticCurveTo(midX, midY, target.x, target.y);
          ctx.strokeStyle = "rgba(17, 17, 17, 0.36)";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        });
      }

      const allNodes = [currentTrack, ...activeRecommendations];
      allNodes.forEach((item, index) => {
        const p = projectedPoint(item);
        if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
        const isCurrent = index === 0;
        const color = isCurrent ? "#111111" : "#b72727";
        const breath = 0.5 + 0.5 * Math.sin(elapsed * (0.7 + index * 0.08) + index);
        const glowRadius = isCurrent ? 30 : 22 + breath * 10;
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
        glow.addColorStop(0, isCurrent ? "rgba(17, 17, 17, 0.16)" : "rgba(183, 39, 39, 0.18)");
        glow.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.beginPath();
        ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        drawStar(ctx, p.x, p.y, isCurrent ? 2.8 : 2.2, isCurrent ? 10 : 8, isCurrent ? 0.9 : 0.72, color);

        ctx.beginPath();
        ctx.arc(p.x, p.y, isCurrent ? 4.5 : 3.5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      });

      requestAnimationFrame(drawCanvas);
    }

    function resize() {
      const rect = els.mapStage.getBoundingClientRect();
      width = Math.max(1, Math.round(rect.width));
      height = Math.max(1, Math.round(rect.height));
      els.mapCanvas.width = width * dpr;
      els.mapCanvas.height = height * dpr;
      els.mapCanvas.style.width = `${width}px`;
      els.mapCanvas.style.height = `${height}px`;
      drawMap();
    }

    function startMapAnimation() {
      if (mapAnimationStarted) return;
      mapAnimationStarted = true;
      requestAnimationFrame(drawCanvas);
    }

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    async function loadMapDataWithRetry() {
      let lastError = null;
      for (let attempt = 1; attempt <= 3; attempt += 1) {
        try {
          const data = await d3.json("./vendor/countries-110m.json");
          if (data?.objects?.countries) return data;
          throw new Error("Map data is missing countries topology");
        } catch (error) {
          lastError = error;
          if (attempt < 3) {
            await wait(180 * attempt);
          }
        }
      }
      throw lastError || new Error("Map data failed to load");
    }

    async function loadMap() {
      resize();
      try {
        mapData = await loadMapDataWithRetry();
        worldFeatures = topojson.feature(mapData, mapData.objects.countries);
        borders = topojson.mesh(mapData, mapData.objects.countries, (a, b) => a !== b);
      } catch (error) {
        console.warn("Using fallback map data", error);
        mapData = null;
        worldFeatures = createFallbackWorldFeatures();
        borders = null;
        if (els.mapStatus) {
          els.mapStatus.textContent = t("music.status.mapDataFailed");
        }
      }
      resize();
      startMapAnimation();
    }

    function renderRecommendations() {
      const hasRecommendations = activeRecommendations.length > 0;
      els.sidePanel?.classList.toggle("has-recommendations", hasRecommendations);
      if (!hasRecommendations) {
        els.recommendList.innerHTML = `
          <article class="rec-card is-placeholder">
            <div class="meta-label">${t("music.rec.waitingLabel")}</div>
            <p>${t("music.side.waitingCopy")}</p>
          </article>
        `;
        return;
      }

      els.recommendList.innerHTML = activeRecommendations.map((item, index) => {
        const isFavorite = window.EchoFavoriteStore?.isFavorite(item);
        const cover = item.coverArtUrl
          ? `<img class="rec-cover" src="${escapeHtml(item.coverArtUrl)}" alt="${escapeHtml(item.title)} ${t("music.cover.suffix")}" loading="lazy">`
          : `<div class="rec-cover is-empty" aria-hidden="true">ECHO</div>`;
        const platformLink = item.platformTrackUrl
          ? `<a class="rec-link" href="${escapeHtml(item.platformTrackUrl)}" target="_blank" rel="noopener">${t("music.rec.platformPlay")}</a>`
          : "";
        const fullLink = item.fullTrackUrl && item.fullTrackUrl !== item.platformTrackUrl
          ? `<a class="rec-link" href="${escapeHtml(item.fullTrackUrl)}" target="_blank" rel="noopener">${t("music.rec.originalLink")}</a>`
          : "";
        return `
        <article class="rec-card${isSameTrack(item, currentTrack) ? " is-selected" : ""}" role="button" tabindex="0" data-rec-index="${index}">
          <button class="favorite-button${isFavorite ? " is-active" : ""}" type="button" data-favorite-index="${index}" aria-label="${isFavorite ? t("music.rec.unfavorite") : t("music.rec.favorite")} ${escapeHtml(item.title)}" title="${isFavorite ? t("music.rec.unfavorite") : t("music.rec.favorite")}">
            ${isFavorite ? "★" : "☆"}
          </button>
          <div class="rec-card-main">
            ${cover}
            <div class="rec-card-content">
              <div class="meta-label">${String(index + 1).padStart(2, "0")} / ${escapeHtml(item.country)} / ${escapeHtml(item.sourceDataset || item.platform || "catalog")}</div>
              <h2>${escapeHtml(item.title)}</h2>
              <p>${escapeHtml(item.artist)} - ${escapeHtml(item.city)}, ${escapeHtml(item.country)}</p>
              <p class="rec-description${item.descriptionLoading ? " is-loading" : ""}">${escapeHtml(recommendationDescription(item))}</p>
              <div class="rec-meta">
                <span class="tag">${escapeHtml(displayGenre(item))}</span>
                <span class="tag">${escapeHtml(displaySource(item))}</span>
                <span class="tag">${recommendationMatchLabel(item, index)}</span>
              </div>
              ${platformLink || fullLink ? `<div class="rec-links">${platformLink}${fullLink}</div>` : ""}
            </div>
          </div>
        </article>
      `;
      }).join("");

      els.recommendList.querySelectorAll("[data-rec-index]").forEach((card) => {
        card.addEventListener("click", (event) => {
          if (event.target.closest("a, button")) return;
          selectTrack(activeRecommendations[Number(card.dataset.recIndex)], { autoplay: true });
        });
        card.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          if (event.target.closest("a, button")) return;
          event.preventDefault();
          selectTrack(activeRecommendations[Number(card.dataset.recIndex)], { autoplay: true });
        });
      });

      els.recommendList.querySelectorAll("[data-favorite-index]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const item = activeRecommendations[Number(button.dataset.favoriteIndex)];
          window.EchoFavoriteStore?.toggle(item);
          renderRecommendations();
        });
      });

    let recommendBusy = false;
    async function startRecommendations() {
      if (recommendBusy) return;
      recommendBusy = true;
      els.recommendButton.classList.add("is-running");
      els.recommendButton.classList.add("is-disabled");
      els.recommendButton.textContent = t("music.recommend.running");
      els.mapStatus.textContent = t("music.status.generatingPath");
      recommendationsPersistable = false;
      activeRecommendations = [];
      clearMusicStationState();
      renderRecommendations();
      renderParameterPanel();
      drawMap();

      try {
        const hasUploadedSeed = Boolean(uploadedAudioFile && currentTrack.fileObjectUrl);
        let response;
        if (hasUploadedSeed) {
          const form = new FormData();
          form.append("file", uploadedAudioFile, uploadedAudioFile.name);
          form.append("title", currentTrack.title || uploadedAudioFile.name);
          form.append("artist", currentTrack.artist || "Uploaded audio");
          if (currentTrack.culture) {
            form.append("seed_culture", currentTrack.culture);
          }
          form.append("mode", "open");
          form.append("k", String(getRecommendCount()));
          form.append("recall_k", "900");
          form.append("random_seed", String(Date.now() % 100000));
          form.append("prefer_cuda", String(apiPreferCuda));
          form.append("exclude_same_artist", "false");
          form.append("exclude_low_signal", "true");
          form.append("max_seconds", "30");
          form.append("window_count", "1");
          form.append("window_strategy", "single");
          form.append("compress_upload", "true");
          form.append("compression_bitrate", "192k");
          form.append("compression_sample_rate_hz", "44100");
          form.append("compression_channels", "2");
          response = await fetch("/api/mainline/upload_recommend", {
            method: "POST",
            body: form
          });
        } else {
          const body = {
            seed_track_id: primaryTrack.trackId || currentTrack.trackId || initialSeedTrackId || null,
            seed_culture: primaryTrack.trackId || currentTrack.trackId || initialSeedTrackId ? null : (initialSeedCulture || null),
            mode: "open",
            k: getRecommendCount(),
            recall_k: 900,
            random_seed: Date.now() % 100000,
            prefer_cuda: apiPreferCuda,
            exclude_same_artist: false,
            exclude_low_signal: true
          };
          response = await fetch("/api/mainline/recommend", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
        }
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`${t("music.error.recommendFail")}：${response.status} ${errorText}`);
        }
        const data = await response.json();
        if (hasUploadedSeed) {
          uploadedAudioMeta = {
            ...(uploadedAudioMeta || {}),
            backendUpload: data.upload || null,
            cultureInference: data.culture_inference || null,
            embedding: data.embedding || null
          };
          if (data.seeds?.[0]) {
            const uploadSeed = trackFromApiItem(data.seeds[0], 0);
            Object.assign(currentTrack, {
              title: uploadSeed.title || currentTrack.title,
              artist: uploadSeed.artist || currentTrack.artist,
              album: uploadSeed.album || currentTrack.album || "",
              country: uploadSeed.country || currentTrack.country,
              city: uploadSeed.city || currentTrack.city,
              lat: Number.isFinite(uploadSeed.lat) ? uploadSeed.lat : currentTrack.lat,
              lng: Number.isFinite(uploadSeed.lng) ? uploadSeed.lng : currentTrack.lng,
              locationPrecision: uploadSeed.locationPrecision || currentTrack.locationPrecision,
              label: uploadSeed.label || currentTrack.label,
              genre: uploadSeed.genre || currentTrack.genre || "",
              tags: uploadSeed.tags || currentTrack.tags || "",
              sourceDataset: uploadSeed.sourceDataset || currentTrack.sourceDataset || "upload",
              platform: uploadSeed.platform || currentTrack.platform || "upload",
              style: uploadSeed.style || currentTrack.style,
              coverArtUrl: uploadSeed.coverArtUrl || currentTrack.coverArtUrl || "",
              audioUrl: uploadSeed.audioUrl || currentTrack.audioUrl || "",
              raw: uploadSeed.raw || currentTrack.raw
            });
            centerLng = currentTrack.lng;
            centerLat = currentTrack.lat;
          }
          const inferredCulture = data.culture_inference?.culture;
          if (inferredCulture) {
            const embeddingProvider = String(data.embedding?.provider || "").toLowerCase() === "gemini"
              ? "Gemini Embedding 2"
              : "CultureMERT";
            currentTrack.culture = inferredCulture;
            currentTrack.style = `${t("music.local.uploadArtist")} / ${embeddingProvider} / ${cultureLabel(inferredCulture) || inferredCulture}`;
          }
          primaryTrack = { ...currentTrack };
        }
        if (data.seeds?.[0]) {
          if (!hasUploadedSeed) {
            primaryTrack = trackFromApiItem(data.seeds[0], 0);
          }
          if (!hasUploadedSeed && !currentTrack.fileObjectUrl && !currentTrack.trackId) {
            replaceCurrentTrack(primaryTrack);
          }
        }
        recommendations = (data.recommendations || []).map((item, index) => trackFromApiItem(item, index));
        activeRecommendations = recommendations.map(localizeDefaultRec);
        recommendationsPersistable = true;
        applyCachedDescriptions(activeRecommendations);
        els.recommendButton.classList.remove("is-running");
        els.recommendButton.classList.remove("is-disabled");
        recommendBusy = false;
        els.recommendButton.textContent = t("music.recommend.regenerate");
        const embeddingTime = data.embedding?.elapsed_seconds ? ` / embedding ${Number(data.embedding.elapsed_seconds).toFixed(1)}s` : "";
        els.mapStatus.textContent = `${activeRecommendations.length}${t("music.status.connectionsActive")}${embeddingTime}`;
        els.mapMode.textContent = t("music.status.networkExpanded");
        syncTrackReadouts();
        renderRecommendations();
        hydrateRecommendationDescriptions(activeRecommendations);
        hydrateTrackCountries([primaryTrack, currentTrack, ...activeRecommendations]);
        renderParameterPanel();
        drawMap();
        persistMusicStationState();
      } catch (error) {
        console.error(error);
        activeRecommendations = recommendations.map(localizeDefaultRec);
        recommendationsPersistable = false;
        applyCachedDescriptions(activeRecommendations);
        els.recommendButton.classList.remove("is-running");
        els.recommendButton.classList.remove("is-disabled");
        recommendBusy = false;
        els.recommendButton.textContent = t("music.recommend.regenerate");
        els.mapStatus.textContent = t("music.status.apiFallback");
        renderRecommendations();
        hydrateRecommendationDescriptions(activeRecommendations);
        hydrateTrackCountries([primaryTrack, currentTrack, ...activeRecommendations]);
        renderParameterPanel();
        drawMap();
      }
    }

    function clampLat(value) {
      return Math.max(-68, Math.min(74, value));
    }

    function normalizeLng(value) {
      let next = Number(value);
      if (!Number.isFinite(next)) return centerLng;
      while (next > 180) next -= 360;
      while (next < -180) next += 360;
      return next;
    }

    function panBy(deltaLng = 0, deltaLat = 0) {
      centerLng = normalizeLng(centerLng + deltaLng);
      centerLat = clampLat(centerLat + deltaLat);
      drawMap();
    }

    function panByPointerDelta(dx = 0, dy = 0, event = null) {
      const dragScale = event?.pointerType === "touch" ? 1.28 : event?.pointerType === "pen" ? 1.12 : 1;
      if (!projection || width <= 1 || height <= 1) {
        panBy(-dx * 0.35 * dragScale, dy * 0.24 * dragScale);
        return;
      }

      const shiftedCenter = projection.invert([
        width / 2 - dx * dragScale,
        height / 2 - dy * dragScale
      ]);
      if (!shiftedCenter || !Number.isFinite(shiftedCenter[0]) || !Number.isFinite(shiftedCenter[1])) {
        panBy(-dx * 0.35 * dragScale, dy * 0.24 * dragScale);
        return;
      }

      centerLng = normalizeLng(shiftedCenter[0]);
      centerLat = clampLat(shiftedCenter[1]);
      drawMap();
    }

    function beginPan(directionX, directionY) {
      panBy(directionX * 9, directionY * 6);
      clearInterval(panInterval);
      panInterval = setInterval(() => panBy(directionX * 4, directionY * 2.8), 45);
    }

    function stopPan() {
      clearInterval(panInterval);
      panInterval = null;
    }

    function scrollWholeStation(delta) {
      const targets = [els.consolePanel, els.sidePanel, els.recommendList]
        .filter(Boolean)
        .filter((node, index, all) => all.indexOf(node) === index);
      targets.forEach((node) => {
        node.scrollTop += delta;
      });
    }

    function routeEdgeWheelToConsole(event) {
      const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
      scrollWholeStation(delta);
      event.preventDefault();
      event.stopPropagation();
    }

    function isStationGutterWheel(event) {
      if (window.matchMedia("(max-width: 960px)").matches) return false;
      const shell = document.querySelector(".station-shell");
      if (!shell) return false;
      const rect = shell.getBoundingClientRect();
      return event.clientX < rect.left || event.clientX > rect.right;
    }

    function routeGutterWheelToWholeStation(event) {
      if (!isStationGutterWheel(event)) return;
      routeEdgeWheelToConsole(event);
    }

    function handleMapWheel(event) {
      const rect = els.mapStage.getBoundingClientRect();
      const x = event.clientX - rect.left;
      if (x < 40 || x > rect.width - 40) {
        routeEdgeWheelToConsole(event);
        return;
      }
      const nextZoom = mapZoom + (event.deltaY < 0 ? 0.04 : -0.04);
      mapZoom = Math.max(0.9, Math.min(1.3, nextZoom));
      drawMap();
      event.preventDefault();
      event.stopPropagation();
    }

    function restoreMusicStationState() {
      const saved = readMusicStationState();
      if (!saved) return false;
      const restoredRecommendations = saved.activeRecommendations
        .map((item, index) => ({ ...item, metrics: item.metrics || metricsFromApiItem(item, index) }))
        .filter((item) => item.title);
      if (!restoredRecommendations.length) return false;

      recommendationsPersistable = true;
      recommendations = restoredRecommendations.map((item) => ({ ...item }));
      activeRecommendations = restoredRecommendations;
      primaryTrack = {
        ...(saved.primaryTrack || restoredRecommendations[0]),
        metrics: saved.primaryTrack?.metrics || defaultMetrics
      };
      uploadedAudioMeta = saved.uploadedAudioMeta || null;
      uploadedAudioFile = null;
      if (Array.isArray(saved.aiConversationMessages)) {
        aiConversationMessages = saved.aiConversationMessages
          .filter((message) => message && (message.role === "system" || message.role === "user" || message.role === "assistant"))
          .map((message) => ({
            role: message.role,
            content: String(message.content || ""),
            displayContent: String(message.displayContent || ""),
            reasoningContent: String(message.reasoningContent || ""),
            thinkingMode: normalizeAiMode(message.thinkingMode),
            reasoningOpen: Boolean(message.reasoningOpen)
          }));
      }

      const selectedTrack = saved.currentTrack || primaryTrack;
      selectTrack(selectedTrack, { autoplay: false });
      if (Number.isFinite(Number(saved.centerLng)) && Number.isFinite(Number(saved.centerLat))) {
        centerLng = Number(saved.centerLng);
        centerLat = Number(saved.centerLat);
      }
      if (Number.isFinite(Number(saved.mapZoom))) {
        mapZoom = Math.max(0.9, Math.min(1.3, Number(saved.mapZoom)));
      }
      els.recommendButton.classList.remove("is-running");
      els.recommendButton.textContent = t("music.recommend.regenerate");
      els.mapStatus.textContent = saved.mapStatus || `${activeRecommendations.length}${t("music.status.connectionsRestored")}`;
      els.mapMode.textContent = saved.mapMode || t("music.status.networkRestored");
      applyCachedDescriptions(activeRecommendations);
      renderRecommendations();
      hydrateRecommendationDescriptions(activeRecommendations);
      hydrateTrackCountries([primaryTrack, currentTrack, ...activeRecommendations]);
      renderParameterPanel();
      renderAiMessages();
      drawMap();
      updateProgressUI();
      persistMusicStationState();
      return true;
    }

    function setNoStartupTrack(statusText = t("music.status.skipStartup")) {
      recommendationsPersistable = false;
      activeRecommendations = [];
      clearMusicStationState();
      primaryTrack = {
        ...currentTrack,
        title: t("music.default.noTrack"),
        artist: t("music.default.waiting"),
        city: mysteryPlace.city,
        province: "",
        country: mysteryPlace.country,
        lat: mysteryPlace.lat,
        lng: mysteryPlace.lng,
        locationPrecision: mysteryPlace.precision,
        genre: t("music.default.unknown"),
        sourceDataset: t("music.default.notLoaded"),
        style: t("music.default.unknown"),
        note: t("music.default.noStartupHint"),
        trackId: "",
        track_id: "",
        coverArtUrl: "",
        platformTrackUrl: "",
        fullTrackUrl: "",
        previewUrl: "",
        audioUrl: "",
        fileObjectUrl: ""
      };
      replaceCurrentTrack(primaryTrack);
      if (els.audio.src) {
        els.audio.pause();
        els.audio.removeAttribute("src");
        els.audio.load();
      }
      setPlaybackState(false);
      centerLng = currentTrack.lng;
      centerLat = currentTrack.lat;
      els.mapStatus.textContent = statusText;
      els.mapMode.textContent = t("music.status.waitingTrack");
      syncTrackReadouts();
      renderRecommendations();
      renderParameterPanel();
      drawMap();
      updateProgressUI();
    }

    async function loadInitialTrack(options = {}) {
      recommendationsPersistable = false;
      clearMusicStationState();
      els.mapStatus.textContent = t("music.status.connectingLibrary");
      try {
        const randomSeed = options.randomSeed ?? Date.now();
        const cultureQuery = initialSeedCulture ? `culture=${encodeURIComponent(initialSeedCulture)}&` : "";
        const endpoint = initialSeedTrackId
          ? `/api/mainline/tracks/${encodeURIComponent(initialSeedTrackId)}?prefer_cuda=${apiPreferCuda}`
          : `/api/mainline/random?${cultureQuery}random_seed=${encodeURIComponent(randomSeed)}&prefer_cuda=${apiPreferCuda}`;
        const response = await fetch(endpoint);
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`${t("music.error.loadTrackFail")}：${response.status} ${errorText}`);
        }
        const data = await response.json();
        const item = data.track || data;
        const track = trackFromApiItem(item, 0);
        primaryTrack = track;
        activeRecommendations = [];
        selectTrack(track, { autoplay: false });
        els.mapStatus.textContent = t("music.status.libraryConnected");
        els.mapMode.textContent = t("music.status.realLoaded");
        return true;
      } catch (error) {
        console.error(error);
        els.mapStatus.textContent = t("music.status.libraryUnavailable");
        return false;
      }
    }

    async function loadLastStartupTrack() {
      recommendationsPersistable = false;
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(lastStartupTrackKey) || "null");
      } catch (error) {
        saved = null;
      }
      if (!saved?.title) {
        setNoStartupTrack(t("music.status.noPrevTrack"));
        return false;
      }
      if (saved.localAudioId) {
        try {
          const record = await getLocalAudioRecord(saved.localAudioId);
          if (record?.blob) {
            const file = new File([record.blob], record.fileName || `${saved.title}.mp3`, {
              type: record.fileType || record.blob.type || "audio/mpeg",
              lastModified: record.lastModified || Date.now()
            });
            applyLocalAudioFile(file, { ...saved, ...record, source: t("music.status.favLocalLoaded"), fromFavorites: true });
            els.mapStatus.textContent = t("music.status.favLocalLoaded");
            return true;
          }
        } catch (error) {
          console.warn(error);
        }
      }
      primaryTrack = { ...saved, metrics: saved.metrics || defaultMetrics };
      activeRecommendations = [];
      selectTrack(primaryTrack, { autoplay: false });
      els.mapStatus.textContent = t("music.status.favLocalLoaded");
      els.mapMode.textContent = t("music.status.favRandom");
      return true;
    }

    async function loadRandomFavoriteTrack() {
      recommendationsPersistable = false;
      await window.EchoFavoriteStore?.hydrateFromServer?.({ seed: false }).catch(() => null);
      const favorites = window.EchoFavoriteStore?.read?.() || [];
      if (!favorites.length) {
        setNoStartupTrack(t("music.status.noFavRandom"));
        return false;
      }
      const item = favorites[Math.floor(Math.random() * favorites.length)];
      const track = { ...trackFromApiItem(item, 0), fromFavorites: true };
      primaryTrack = track;
      activeRecommendations = [];
      selectTrack(track, { autoplay: false });
      els.mapStatus.textContent = t("music.status.favRandomLoaded");
      els.mapMode.textContent = t("music.status.favRandom");
      return true;
    }

    async function initializeStartupTrack() {
      const loadedLocal = await loadPendingLocalAudio();
      if (loadedLocal) return;
      if (initialSeedTrackId || initialSeedCulture) {
        await loadInitialTrack({ randomSeed: Date.now() });
        return;
      }
      if (restoreMusicStationState()) return;
      const mode = startupTrackMode();
      if (mode === "last") {
        await loadLastStartupTrack();
        return;
      }
      if (mode === "favorite-random") {
        await loadRandomFavoriteTrack();
        return;
      }
      if (mode === "none") {
        setNoStartupTrack();
        return;
      }
      await loadInitialTrack({ randomSeed: Date.now() });
    }

    async function loadPendingLocalAudio() {
      const raw = sessionStorage.getItem(pendingLocalPlayKey) || "{}";
      let metadata = {};
      try {
        metadata = JSON.parse(raw);
      } catch (error) {
        metadata = {};
      }
      const localId = initialLocalAudioId || metadata.id || metadata.localAudioId || "";
      if (!localId) return false;

      try {
        const record = await getLocalAudioRecord(localId);
        if (!record?.blob) {
          els.mapStatus.textContent = t("music.status.favLocalNotFound");
          return false;
        }
        const fileName = record.fileName || metadata.fileName || `${record.title || metadata.title || "local-audio"}.mp3`;
        const fileType = record.fileType || metadata.fileType || record.blob.type || "audio/mpeg";
        const file = new File([record.blob], fileName, {
          type: fileType,
          lastModified: record.lastModified || metadata.lastModified || Date.now()
        });
        applyLocalAudioFile(file, {
          ...record,
          ...metadata,
          id: localId,
          source: t("music.rec.favorite"),
          fromFavorites: true
        });
        sessionStorage.removeItem(pendingLocalPlayKey);
        els.mapStatus.textContent = t("music.status.favLocalLoaded");
        return true;
      } catch (error) {
        console.error(error);
        els.mapStatus.textContent = t("music.status.favLocalFailed");
        return false;
      }
    }

    function endMapDrag(event) {
      dragging = false;
      els.mapStage.classList.remove("is-dragging");
      if (event && els.mapStage.hasPointerCapture(event.pointerId)) {
        els.mapStage.releasePointerCapture(event.pointerId);
      }
    }

    els.mapStage.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      event.preventDefault();
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      els.mapStage.classList.add("is-dragging");
      els.mapStage.setPointerCapture(event.pointerId);
    });

    els.mapStage.addEventListener("pointermove", (event) => {
      const rect = els.mapStage.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      els.mapStage.classList.toggle("show-left", x < 40);
      els.mapStage.classList.toggle("show-right", x > rect.width - 40);
      els.mapStage.classList.toggle("show-up", y < 76);
      els.mapStage.classList.toggle("show-down", y > rect.height - 76);

      if (!dragging) return;
      event.preventDefault();
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;
      panByPointerDelta(dx, dy, event);
    });

    els.mapStage.addEventListener("pointerup", endMapDrag);
    els.mapStage.addEventListener("pointercancel", endMapDrag);


    els.mapStage.addEventListener("pointerleave", () => {
      if (dragging) return;
      els.mapStage.classList.remove("show-left", "show-right", "show-up", "show-down", "is-dragging");
    });

    document.querySelectorAll(".pan-button").forEach((button) => {
      const directionX = Number(button.dataset.panX || 0);
      const directionY = Number(button.dataset.panY || 0);
      button.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        beginPan(directionX, directionY);
      });
      button.addEventListener("pointerup", stopPan);
      button.addEventListener("pointerleave", stopPan);
    });

    document.querySelectorAll(".pan-zone.left, .pan-zone.right").forEach((zone) => {
      zone.addEventListener("wheel", routeEdgeWheelToConsole, { passive: false });
    });

    els.mapStage.addEventListener("wheel", handleMapWheel, { passive: false });

    document.addEventListener("wheel", routeGutterWheelToWholeStation, { passive: false });

    els.recommendButton.addEventListener("click", startRecommendations);

    els.aiModeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (aiBusy) return;
        setAiMode(button.dataset.aiMode);
      });
    });
    els.aiRunButton.addEventListener("click", () => runAiAnalysis());
    els.aiSendButton.addEventListener("click", sendAiFollowup);
    els.aiQuestion.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        sendAiFollowup();
      }
    });

    els.prevButton.addEventListener("click", () => playQueueDelta(-1));
    els.nextButton.addEventListener("click", () => playQueueDelta(1));

    els.playButton.addEventListener("click", () => {
      setPlaybackState(!isPlaying);
    });

    els.audio.addEventListener("loadedmetadata", updateProgressUI);
    els.audio.addEventListener("timeupdate", updateProgressUI);
    els.audio.addEventListener("ended", () => {
      if (getPlaybackQueue().length > 1) {
        playQueueDelta(1);
      } else {
        isPlaying = false;
        els.playButton.classList.remove("is-playing");
        els.playState.textContent = playbackTrackLabel(currentTrack);
      }
    });

    els.progressTrack.addEventListener("pointerdown", (event) => {
      isScrubbing = true;
      scrubTo(event.clientX);
      els.progressTrack.setPointerCapture(event.pointerId);
    });

    els.progressTrack.addEventListener("pointermove", (event) => {
      if (!isScrubbing) return;
      scrubTo(event.clientX);
    });

    els.progressTrack.addEventListener("pointerup", (event) => {
      isScrubbing = false;
      if (els.progressTrack.hasPointerCapture(event.pointerId)) {
        els.progressTrack.releasePointerCapture(event.pointerId);
      }
    });

    els.progressTrack.addEventListener("pointerleave", () => {
      isScrubbing = false;
    });

    els.upload.addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      applyLocalAudioFile(file, { source: t("music.local.uploadSource") });
    });

    /* ── 现场录制 ── */
    let mediaRecorder = null;
    let recordedChunks = [];

    els.recordButton.addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        els.recordButton.classList.remove("is-recording");
        els.recordButton.textContent = t("music.record");
        els.recordButton.setAttribute("data-i18n", "music.record");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
          ? "audio/webm;codecs=opus"
          : "audio/webm";
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((trk) => trk.stop());
          if (!recordedChunks.length) return;
          const blob = new Blob(recordedChunks, { type: mimeType });
          const ext = mimeType.includes("opus") ? "webm" : "webm";
          const file = new File([blob], `recorded_audio.${ext}`, { type: mimeType });
          applyLocalAudioFile(file, { source: t("music.local.recordSource") });
        };
        mediaRecorder.start();
        els.recordButton.classList.add("is-recording");
        els.recordButton.textContent = t("music.record.stop");
        els.recordButton.setAttribute("data-i18n", "music.record.stop");
      } catch (err) {
        console.error("Microphone access denied:", err);
      }
    });

    setInterval(() => {
      if (!isPlaying || isScrubbing) return;
      simulatedSeconds += 1;
      updateProgressUI();
    }, 1000);

    if ("ResizeObserver" in window) {
      new ResizeObserver(resize).observe(els.mapStage);
    }
    window.addEventListener("resize", resize);
    window.addEventListener("echo-language-change", () => {
      renderAiMessages();
      setAiBusy(aiBusy);
    });
    window.addEventListener("pagehide", () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      if (currentTrack.fileObjectUrl && currentTrack.fileObjectUrl.startsWith("blob:")) {
        URL.revokeObjectURL(currentTrack.fileObjectUrl);
      }
      persistLastStartupTrack();
      persistMusicStationState();
    });
    syncTrackReadouts();
    loadMainlineStatus();
    window.EchoFavoriteStore?.hydrateFromServer?.({ seed: false }).then(() => {
      renderRecommendations();
    }).catch(() => {});
    renderRecommendations();
    renderParameterPanel();
    syncAiModeControls();
    renderAiMessages();
    loadGeoData()
      .then(() => initializeStartupTrack())
      .catch((error) => {
        console.error(error);
        setNoStartupTrack(t("music.status.initFailed"));
      });
    loadMap().catch((error) => {
      els.mapStatus.textContent = t("music.status.mapDataFailed");
      console.error(error);
    });
    if (window.location.hash === "#ai-analysis") {
      window.setTimeout(() => {
        document.getElementById("ai-analysis")?.scrollIntoView({ block: "start" });
      }, 900);
    }
  </script>
</body>
</html>
