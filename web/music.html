<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Echo 音乐台 — 跨文化音乐推荐系统，上传音频或从曲库探索世界各地的音乐。">
  <title>Echo | 音乐台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23111111'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ffffff' stroke-width='4'/%3E%3Cpath d='M18 32h28' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #646464;
      --line: rgba(17, 17, 17, 0.14);
      --line-strong: rgba(17, 17, 17, 0.28);
      --soft: #f7f7f7;
      --soft-2: #efefef;
      --accent: #111111;
      --alert: #b72727;
      --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-main);
      overflow-x: hidden;
    }

    body {
      background:
        linear-gradient(90deg, rgba(17, 17, 17, 0.026) 1px, transparent 1px),
        linear-gradient(180deg, rgba(17, 17, 17, 0.026) 1px, transparent 1px),
        #ffffff;
      background-size: 72px 72px;
    }

    @media (min-width: 1121px) {
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
    }

    a,
    button,
    label {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .station-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(720px, 1.55fr) minmax(420px, 0.45fr);
      align-items: stretch;
      gap: 0;
      padding: 0;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .player-head,
    .rec-head {
      min-height: 4.8rem;
      display: grid;
      align-items: center;
      padding: 0.95rem 2rem;
    }

    .player-head {
      grid-template-columns: auto minmax(220px, 1fr) auto;
      gap: 1.35rem;
      border-right: 1px solid var(--line);
    }

    .rec-head {
      justify-content: stretch;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 0.75rem;
      min-width: 0;
    }

    .brand-mark {
      font-size: clamp(1.4rem, 2vw, 2.1rem);
      font-weight: 400;
      letter-spacing: 0;
    }

    .brand-sub,
    .meta-label,
    .mono {
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .now-playing {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr);
      gap: 0.85rem;
      align-items: center;
      min-width: 0;
      padding-left: 1.2rem;
      border-left: 1px solid var(--line);
    }

    .top-cover-wrap {
      position: relative;
      width: 3rem;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 68% 32%, rgba(255, 255, 255, 0.74), transparent 0.48rem),
        linear-gradient(135deg, #eeeeee, #cfcfcf 48%, #111111 49%, #111111);
    }

    .top-cover {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    .status-dot {
      position: absolute;
      left: 0.38rem;
      bottom: 0.38rem;
      width: 0.7rem;
      height: 0.7rem;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 0 0 0 0 rgba(17, 17, 17, 0.22);
      animation: pulse 2.3s ease infinite;
    }

    .track-kicker {
      margin-bottom: 0.15rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      text-transform: uppercase;
    }

    .track-title-line {
      display: flex;
      align-items: baseline;
      gap: 0.65rem;
      min-width: 0;
      font-size: 1.08rem;
    }

    .track-title-line strong {
      max-width: 32vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 400;
    }

    .track-title-line span {
      color: var(--muted);
      font-size: 0.94rem;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.3rem;
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-size: 0.84rem;
      text-transform: uppercase;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
      white-space: nowrap;
    }

    .pill:hover,
    .pill.is-active {
      background: var(--ink);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .upload-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .record-btn.is-recording {
      background: var(--alert);
      color: #ffffff;
      animation: record-pulse 1.2s ease-in-out infinite;
    }

    @keyframes record-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .station-shell {
      width: 100%;
      margin: 0;
      min-height: calc(100vh - 73px);
      display: grid;
      grid-template-columns: minmax(720px, 1.55fr) minmax(420px, 0.45fr);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    @media (min-width: 1121px) {
      .station-shell {
        height: calc(100vh - 4.8rem);
        min-height: 0;
        overflow: hidden;
        overscroll-behavior: contain;
      }

      .console,
      .side-panel {
        height: 100%;
        min-height: 0;
        overflow-y: auto;
        scrollbar-gutter: stable;
        overscroll-behavior: contain;
      }
    }

    .console {
      display: grid;
      grid-template-rows: auto minmax(540px, 1fr) auto auto;
      min-height: calc(100vh - 73px);
      border-right: 1px solid var(--line);
      background: #ffffff;
    }

    .console-top {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 1rem;
      padding: 1.35rem 1.45rem;
      border-bottom: 1px solid var(--line);
    }

    .readout {
      min-width: 0;
    }

    .meta-label {
      margin-bottom: 0.35rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .readout strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1.12rem;
      font-weight: 400;
    }

    .map-stage {
      position: relative;
      min-height: clamp(420px, 58vh, 620px);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(17, 17, 17, 0.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(17, 17, 17, 0.04) 1px, transparent 1px),
        #ffffff;
      background-size: 48px 48px;
      cursor: grab;
      overscroll-behavior: contain;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .map-stage.is-dragging {
      cursor: grabbing;
    }

    #map-svg,
    #map-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #map-svg {
      z-index: 1;
      pointer-events: none;
    }

    #map-canvas {
      z-index: 2;
      pointer-events: none;
    }

    .map-ui {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .map-label {
      position: absolute;
      transform: translate(-50%, 14px);
      max-width: min(10rem, 34vw);
      color: rgba(17, 17, 17, 0.5);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      line-height: 1.25;
      text-align: center;
      text-transform: uppercase;
      white-space: normal;
      overflow-wrap: anywhere;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 999px;
      padding: 0.2rem 0.35rem;
    }

    .map-label.is-current {
      color: var(--ink);
      font-weight: 700;
    }

    .map-label.is-recommendation {
      color: rgba(183, 39, 39, 0.86);
    }

    .map-label.is-recommendation:hover,
    .map-label.is-selected {
      background: rgba(183, 39, 39, 0.08);
      color: var(--alert);
    }

    .map-corner {
      position: absolute;
      max-width: min(14rem, 42vw);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.25;
      text-transform: uppercase;
      pointer-events: none;
    }

    .map-corner.top-left {
      top: 1.25rem;
      left: 1.25rem;
    }

    .map-corner.top-right {
      top: 1.25rem;
      right: 1.25rem;
      text-align: right;
    }

    .map-corner.bottom-left {
      left: 1.25rem;
      bottom: 1.25rem;
    }

    .map-corner.bottom-right {
      right: 1.25rem;
      bottom: 1.25rem;
      text-align: right;
    }

    .pan-zone {
      position: absolute;
      z-index: 6;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }

    .pan-zone.left {
      left: 0;
      top: 0;
      bottom: 0;
      width: 4.8%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0));
    }

    .pan-zone.right {
      right: 0;
      top: 0;
      bottom: 0;
      width: 4.8%;
      background: linear-gradient(270deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0));
    }

    .pan-zone.up {
      top: 0;
      left: 0;
      right: 0;
      height: 16%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0));
    }

    .pan-zone.down {
      bottom: 0;
      left: 0;
      right: 0;
      height: 16%;
      background: linear-gradient(0deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0));
    }

    .map-stage.show-left .pan-zone.left,
    .map-stage.show-right .pan-zone.right,
    .map-stage.show-up .pan-zone.up,
    .map-stage.show-down .pan-zone.down {
      opacity: 1;
      pointer-events: auto;
    }

    .pan-button {
      width: 3.2rem;
      aspect-ratio: 1;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      font-size: 1.5rem;
      line-height: 1;
      backdrop-filter: blur(8px);
    }

    .console-bottom {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 1rem;
      align-items: center;
      padding: 1.2rem 1.45rem;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      z-index: 4;
    }

    .transport {
      display: grid;
      grid-template-columns: auto auto auto minmax(180px, 1fr);
      gap: 0.7rem;
      align-items: center;
      min-width: 0;
    }

    .play-button,
    .skip-button {
      width: 3.2rem;
      aspect-ratio: 1;
      border: 1px solid var(--ink);
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: background 180ms ease, transform 180ms ease;
    }

    .skip-button {
      width: 2.65rem;
      color: var(--ink);
      font-size: 1.28rem;
      line-height: 1;
    }

    .play-button:hover,
    .skip-button:hover {
      background: var(--soft);
      transform: translateY(-1px);
    }

    .play-button span {
      width: 0;
      height: 0;
      margin-left: 0.18rem;
      border-top: 0.45rem solid transparent;
      border-bottom: 0.45rem solid transparent;
      border-left: 0.72rem solid var(--ink);
    }

    .play-button.is-playing span {
      width: 0.72rem;
      height: 0.9rem;
      margin-left: 0;
      border: 0;
      border-left: 0.24rem solid var(--ink);
      border-right: 0.24rem solid var(--ink);
    }

    .progress-wrap {
      min-width: 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.55rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .progress-meta span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-meta span:last-child {
      flex: 0 0 auto;
    }

    .progress-track {
      height: 1.15rem;
      position: relative;
      cursor: pointer;
      touch-action: none;
    }

    .progress-track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--line);
      transform: translateY(-50%);
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 50%;
      height: 1px;
      width: 0;
      background: var(--ink);
      transform: translateY(-50%);
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      right: -0.32rem;
      top: 50%;
      width: 0.64rem;
      aspect-ratio: 1;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: #ffffff;
      transform: translateY(-50%);
    }

    .recommend-button {
      min-height: 3.2rem;
      padding: 0.85rem 1.4rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: #ffffff;
      font-size: 0.88rem;
      text-transform: uppercase;
      transition: transform 180ms ease, background 180ms ease;
      white-space: nowrap;
    }

    .recommend-button:hover {
      transform: translateY(-1px);
      background: #2a2a2a;
    }

    .recommend-button.is-running {
      background: var(--alert);
      border-color: var(--alert);
    }

    .parameter-lab {
      border-top: 1px solid var(--line);
      background: var(--line);
      display: grid;
      gap: 1px;
    }

    .parameter-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .parameter-metric,
    .parameter-panel {
      background: #ffffff;
      padding: 1.35rem 1.45rem;
    }

    .parameter-metric {
      min-height: 174px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .parameter-metric.is-dark {
      background: var(--ink);
      color: #ffffff;
    }

    .parameter-metric.is-dark .meta-label,
    .parameter-metric.is-dark .parameter-sub {
      color: rgba(255, 255, 255, 0.58);
    }

    .parameter-metric-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
    }

    .parameter-value {
      font-size: clamp(2.35rem, 4.4vw, 4.9rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 0.92;
    }

    .parameter-sub {
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .parameter-grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 0.8fr);
      gap: 1px;
      background: var(--line);
    }

    .recommendation-insights-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      padding: 1rem;
      background: #f4f4f4;
    }

    .recommendation-insights-grid.is-empty {
      grid-template-columns: 1fr;
      padding: 0.8rem 1rem;
    }

    .insights-empty-bar {
      display: flex;
      align-items: center;
      min-height: 4.2rem;
      padding: 0.9rem 1.2rem;
      border: 1px solid rgba(17, 17, 17, 0.08);
      border-radius: 0.5rem;
      background: #ffffff;
      box-shadow: 0 0.75rem 1.8rem rgba(17, 17, 17, 0.06);
      color: #7b8290;
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .insight-card {
      position: relative;
      min-height: 30rem;
      overflow: hidden;
      border: 1px solid rgba(17, 17, 17, 0.06);
      border-radius: 0.5rem;
      background: #ffffff;
      box-shadow: 0 1.15rem 2.6rem rgba(17, 17, 17, 0.08);
      color: #1e2a44;
    }

    .insight-card-title {
      position: absolute;
      top: 1.45rem;
      left: 1.35rem;
      right: 1.35rem;
      z-index: 0;
      overflow: hidden;
      color: rgba(30, 42, 68, 0.08);
      font-size: 3.6rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .insight-card-body {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 5.9rem 1.35rem 1.35rem;
    }

    .insight-empty {
      display: grid;
      min-height: 20rem;
      place-items: center;
      color: #7b8290;
      font-size: 0.92rem;
      line-height: 1.5;
      text-align: center;
    }

    .insight-top {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--alert);
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
    }

    .insight-spark {
      width: 1.6rem;
      aspect-ratio: 1;
      border-radius: 38% 62% 45% 55%;
      background: var(--alert);
      transform: rotate(45deg);
    }

    .insight-cover,
    .insight-cover-fallback {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(17, 17, 17, 0.08);
      border-radius: 0.5rem;
      object-fit: cover;
      background:
        linear-gradient(135deg, rgba(183, 39, 39, 0.94), rgba(30, 42, 68, 0.92)),
        repeating-linear-gradient(45deg, transparent 0 0.5rem, rgba(255, 255, 255, 0.25) 0.5rem 0.68rem);
    }

    .insight-cover-fallback {
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .era-timeline {
      position: relative;
      display: grid;
      gap: 1.35rem;
      padding-left: 0.15rem;
    }

    .era-timeline::before {
      content: "";
      position: absolute;
      top: 0.25rem;
      bottom: 0.25rem;
      left: 35.5%;
      width: 1px;
      background: rgba(30, 42, 68, 0.11);
    }

    .era-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(4.4rem, 0.86fr) 1.2rem minmax(3.6rem, 0.68fr) minmax(3.4rem, 0.54fr);
      gap: 0.72rem;
      align-items: center;
    }

    .era-label {
      font-size: 2.45rem;
      font-weight: 800;
      line-height: 0.98;
      text-align: center;
    }

    .era-row.is-rank-2 .era-label {
      font-size: 2.08rem;
    }

    .era-row.is-rank-3 .era-label {
      font-size: 1.72rem;
    }

    .era-label .top-label {
      display: block;
      margin-bottom: 0.25rem;
      color: var(--alert);
      font-size: 1.05rem;
      line-height: 1;
      text-transform: uppercase;
    }

    .era-dot {
      position: relative;
      z-index: 1;
      justify-self: center;
      width: 0.58rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #aab0bd;
      box-shadow: 0 0 0 0.35rem #ffffff;
    }

    .era-row.is-top .era-dot {
      width: 1.2rem;
      background: #aeb4c0;
    }

    .era-count {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .era-row.is-rank-2 .era-count {
      font-size: 1.82rem;
    }

    .era-row.is-rank-3 .era-count {
      font-size: 1.56rem;
    }

    .genre-hero {
      display: grid;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }

    .genre-title {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.04;
      word-break: break-word;
    }

    .genre-sub {
      overflow: hidden;
      color: #7b8290;
      font-size: 0.98rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .genre-bars {
      display: grid;
      gap: 0.88rem;
    }

    .genre-bar-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.72rem;
      align-items: center;
    }

    .genre-bar-track {
      min-width: 0;
      height: 3rem;
      border-radius: 999px;
      background: #f2f3f6;
      overflow: hidden;
    }

    .genre-bar {
      display: flex;
      align-items: center;
      min-width: 5.8rem;
      width: var(--bar-width);
      max-width: 100%;
      height: 100%;
      padding: 0 0.88rem;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--alert), #9f1f1f);
      color: #ffffff;
      font-size: 1.22rem;
      font-weight: 800;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .genre-percent {
      font-size: 2.05rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .parameter-panel {
      min-height: 380px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .parameter-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.6rem;
    }

    .parameter-panel h2 {
      margin-top: 0.35rem;
      font-size: clamp(1.55rem, 2.3vw, 2.45rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
    }

    .parameter-panel .head-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.65rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .parameter-breakdown,
    .parameter-distribution {
      flex: 1;
      display: grid;
      align-content: start;
      gap: 1rem;
      min-height: 260px;
    }

    .score-row,
    .distribution-row {
      display: grid;
      grid-template-columns: minmax(7rem, 0.28fr) minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: center;
    }

    .score-label,
    .distribution-label {
      min-width: 0;
    }

    .score-label strong,
    .distribution-label strong {
      display: block;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.25;
    }

    .score-label span,
    .distribution-label span,
    .distribution-empty {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .score-track,
    .distribution-track {
      position: relative;
      height: 0.72rem;
      overflow: hidden;
      background: var(--soft-2);
    }

    .score-fill,
    .distribution-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--fill-width);
      background: var(--ink);
    }

    .score-row.is-accent .score-fill,
    .distribution-row.is-accent .distribution-fill {
      background: var(--alert);
    }

    .score-value,
    .distribution-value {
      min-width: 3.5rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      text-align: right;
    }

    .distribution-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .distribution-stat {
      background: #ffffff;
      padding: 0.9rem;
    }

    .distribution-stat strong {
      display: block;
      font-size: 1.85rem;
      font-weight: 400;
      line-height: 1;
    }

    .distribution-stat span {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .ai-lab {
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .ai-strip {
      display: grid;
      grid-template-columns: minmax(150px, 0.32fr) minmax(620px, 1.45fr) auto;
      gap: 1.3rem;
      align-items: end;
      padding: 1.3rem 1.85rem;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .ai-strip h2 {
      margin-top: 0.25rem;
      font-size: clamp(1.6rem, 2.4vw, 3.2rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0;
    }

    .ai-strip p {
      color: var(--muted);
      font-size: clamp(1rem, 1.05vw, 1.18rem);
      line-height: 1.55;
      max-width: none;
      white-space: normal;
      overflow-wrap: break-word;
    }

    .ai-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .ai-mode-toggle {
      display: inline-flex;
      align-items: stretch;
      min-height: 2.75rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      background: #ffffff;
    }

    .ai-mode-option {
      min-width: 4.7rem;
      border: 0;
      border-right: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }

    .ai-mode-option:last-child {
      border-right: 0;
    }

    .ai-mode-option:hover,
    .ai-mode-option.is-active {
      background: var(--ink);
      color: #ffffff;
    }

    .ai-mode-option:disabled {
      cursor: wait;
      opacity: 0.66;
    }

    .ai-panel-head {
      display: grid;
      grid-template-columns: minmax(220px, 0.86fr) minmax(320px, 1.14fr);
      gap: 1px;
      border-bottom: 1px solid var(--line);
      background: var(--line);
    }

    .ai-title,
    .ai-config {
      background: #ffffff;
      padding: 1.55rem 1.85rem;
    }

    .ai-title h2 {
      margin-top: 0.35rem;
      font-size: clamp(2.4rem, 4vw, 5.4rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .ai-title p {
      max-width: 34rem;
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .ai-config {
      display: grid;
      gap: 1rem;
      align-content: start;
    }

    .config-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(150px, 0.56fr);
      gap: 0.8rem;
    }

    .field {
      display: grid;
      gap: 0.45rem;
    }

    .field label,
    .ai-note,
    .ai-context-label {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      text-transform: uppercase;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .field input {
      min-height: 2.75rem;
      padding: 0 0.85rem;
    }

    .field textarea {
      min-height: 6rem;
      resize: vertical;
      padding: 0.85rem;
      line-height: 1.55;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--ink);
      box-shadow: inset 0 -2px 0 var(--ink);
    }

    .ai-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
    }

    .text-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }

    .text-button:hover {
      color: var(--ink);
    }

    .ai-note {
      text-transform: none;
      line-height: 1.55;
    }

    .ai-body {
      display: grid;
      grid-template-columns: minmax(260px, 0.72fr) minmax(420px, 1.28fr);
      gap: 1px;
      background: var(--line);
    }

    .ai-context,
    .ai-chat {
      background: #ffffff;
      min-height: 34rem;
    }

    .ai-context {
      padding: 1.35rem 1.85rem;
      display: grid;
      align-content: start;
      gap: 1rem;
    }

    .ai-context-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .ai-context-item {
      background: #ffffff;
      padding: 0.95rem;
      min-height: 5.8rem;
      display: grid;
      align-content: space-between;
      gap: 0.75rem;
    }

    .ai-context-item strong {
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1;
    }

    .ai-context-item span {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .ai-chat {
      display: flex;
      flex-direction: column;
      border-top: 0;
    }

    .ai-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1.35rem 1.85rem;
      overflow: auto;
      min-height: 24rem;
      max-height: 42rem;
    }

    .ai-message {
      max-width: min(52rem, 92%);
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      line-height: 1.65;
    }

    .ai-message .meta-label {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .ai-message.is-assistant {
      align-self: flex-start;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .ai-message.is-assistant .md-body {
      font-size: 0.94rem;
      line-height: 1.72;
      color: var(--ink);
    }

    .ai-thinking {
      width: min(42rem, 100%);
      margin: 0 0 0.7rem;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--soft);
      overflow: hidden;
    }

    .ai-thinking-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      min-height: 2.45rem;
      padding: 0.65rem 0.85rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      text-align: left;
    }

    .ai-thinking-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .ai-thinking-state {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .ai-thinking-content {
      max-height: 15rem;
      overflow: auto;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .ai-thinking-text {
      margin: 0;
      padding: 0.85rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .ai-thinking:not(.is-open) .ai-thinking-content {
      display: none;
    }

    .ai-message.is-assistant .md-body h1,
    .ai-message.is-assistant .md-body h2,
    .ai-message.is-assistant .md-body h3,
    .ai-message.is-assistant .md-body h4 {
      margin: 1.2em 0 0.45em;
      font-weight: 600;
      line-height: 1.3;
    }

    .ai-message.is-assistant .md-body h1 { font-size: 1.35rem; }
    .ai-message.is-assistant .md-body h2 { font-size: 1.18rem; }
    .ai-message.is-assistant .md-body h3 { font-size: 1.05rem; }
    .ai-message.is-assistant .md-body h4 { font-size: 0.98rem; }

    .ai-message.is-assistant .md-body h1:first-child,
    .ai-message.is-assistant .md-body h2:first-child,
    .ai-message.is-assistant .md-body h3:first-child {
      margin-top: 0;
    }

    .ai-message.is-assistant .md-body p {
      margin: 0.6em 0;
    }

    .ai-message.is-assistant .md-body p:first-child {
      margin-top: 0;
    }

    .ai-message.is-assistant .md-body p:last-child {
      margin-bottom: 0;
    }

    .ai-message.is-assistant .md-body ul,
    .ai-message.is-assistant .md-body ol {
      margin: 0.5em 0;
      padding-left: 1.6em;
    }

    .ai-message.is-assistant .md-body li {
      margin: 0.3em 0;
    }

    .ai-message.is-assistant .md-body li > ul,
    .ai-message.is-assistant .md-body li > ol {
      margin: 0.2em 0;
    }

    .ai-message.is-assistant .md-body strong {
      font-weight: 600;
    }

    .ai-message.is-assistant .md-body em {
      font-style: italic;
    }

    .ai-message.is-assistant .md-body code {
      padding: 0.15em 0.4em;
      border-radius: 3px;
      background: rgba(17, 17, 17, 0.06);
      font-family: var(--font-mono);
      font-size: 0.88em;
    }

    .ai-message.is-assistant .md-body pre {
      margin: 0.7em 0;
      padding: 0.9rem 1.1rem;
      border-radius: 4px;
      background: #1a1a1a;
      color: #e4e4e4;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.55;
    }

    .ai-message.is-assistant .md-body pre code {
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-size: inherit;
    }

    .ai-message.is-assistant .md-body blockquote {
      margin: 0.6em 0;
      padding: 0.4em 1em;
      border-left: 3px solid var(--line-strong);
      color: var(--muted);
    }

    .ai-message.is-assistant .md-body table {
      margin: 0.7em 0;
      border-collapse: collapse;
      width: 100%;
      font-size: 0.88rem;
    }

    .ai-message.is-assistant .md-body th,
    .ai-message.is-assistant .md-body td {
      padding: 0.45em 0.75em;
      border: 1px solid var(--line);
      text-align: left;
    }

    .ai-message.is-assistant .md-body th {
      background: rgba(17, 17, 17, 0.04);
      font-weight: 600;
    }

    .ai-message.is-assistant .md-body hr {
      margin: 1em 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .ai-message.is-assistant .md-body a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .ai-message.is-user {
      align-self: flex-end;
      display: grid;
      gap: 0.35rem;
      max-width: min(38rem, 80%);
      padding: 0.58rem 0.86rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--ink);
      line-height: 1.45;
      text-align: left;
      white-space: normal;
    }

    .ai-message.is-user .meta-label {
      justify-self: start;
      margin-bottom: 0;
      color: var(--muted);
    }

    .ai-message.is-user .message-text {
      white-space: pre-wrap;
    }

    .ai-message.is-system {
      align-self: center;
      max-width: min(48rem, 88%);
      padding: 0.8rem 1.05rem;
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      background: #ffffff;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    .ai-message.is-system .meta-label {
      display: none;
    }

    .ai-composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.8rem;
      align-items: start;
      padding: 1.1rem 1.85rem 1.35rem;
      border-top: 1px solid var(--line);
    }

    .ai-composer .field {
      gap: 0.35rem;
    }

    .ai-composer .field textarea {
      min-height: 3.35rem;
      max-height: 8rem;
      padding: 0.68rem 0.85rem;
      line-height: 1.4;
    }

    .ai-send,
    .ai-run {
      min-height: 2.75rem;
      padding: 0 1.1rem;
    }

    .ai-run.is-running,
    .ai-send.is-running {
      opacity: 0.65;
      cursor: wait;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 73px);
      background: #ffffff;
    }

    .side-head {
      padding: 1.35rem 1.45rem;
      border-bottom: 1px solid var(--line);
    }

    .side-panel.has-recommendations .side-head {
      display: none;
    }

    .side-head h1 {
      margin-top: 0.4rem;
      font-size: clamp(2.8rem, 4.2vw, 5.4rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .recommend-list {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0;
      min-height: 0;
      overflow: auto;
    }

    .rec-card {
      position: relative;
      display: grid;
      gap: 0.75rem;
      padding: 1.25rem 3.35rem 1.25rem 1.45rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      cursor: pointer;
      transition: background 180ms ease;
    }

    .rec-card:not(.is-placeholder):hover {
      background: var(--soft);
    }

    .rec-card.is-selected {
      background: var(--soft);
      box-shadow: inset 3px 0 0 var(--alert);
    }

    .rec-card.is-placeholder {
      color: var(--muted);
      cursor: default;
      line-height: 1.55;
    }

    .rec-card-main {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 0.9rem;
      align-items: start;
      min-width: 0;
    }

    .rec-cover {
      width: 72px;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(17, 17, 17, 0.08), rgba(183, 39, 39, 0.09)),
        #ffffff;
      object-fit: cover;
    }

    .rec-cover.is-empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.58rem;
      text-transform: uppercase;
    }

    .rec-card-content {
      display: grid;
      gap: 0.55rem;
      min-width: 0;
    }

    .rec-card h2 {
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.15;
    }

    .rec-card p {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .rec-description {
      color: #4f4f4f;
    }

    .rec-description.is-loading {
      color: var(--muted);
      font-style: italic;
    }

    .favorite-button {
      position: absolute;
      top: 1.05rem;
      right: 1rem;
      display: inline-grid;
      place-items: center;
      width: 2.15rem;
      height: 2.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1;
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .favorite-button:hover,
    .favorite-button.is-active {
      border-color: var(--ink);
      background: var(--ink);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .rec-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .rec-link {
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-decoration: underline;
      text-underline-offset: 0.16em;
      text-transform: uppercase;
    }

    .rec-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 1.65rem;
      padding: 0.28rem 0.65rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .audio-el {
      display: none;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(17, 17, 17, 0.22);
      }
      70% {
        box-shadow: 0 0 0 0.55rem rgba(17, 17, 17, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(17, 17, 17, 0);
      }
    }

    @media (max-width: 1120px) {
      .station-header {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .player-head {
        grid-template-columns: auto minmax(220px, 1fr) auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .rec-head {
        min-height: auto;
      }

      .now-playing {
        padding-left: 0;
        border-left: 0;
      }

      .top-actions {
        justify-content: center;
        flex-wrap: wrap;
      }

      .station-shell {
        width: 100%;
        grid-template-columns: 1fr;
      }

      .console {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .map-stage {
        min-height: clamp(360px, 54vh, 540px);
      }

      .ai-strip {
        grid-template-columns: 1fr;
        white-space: normal;
      }

      .parameter-grid,
      .parameter-metrics,
      .ai-panel-head,
      .ai-body {
        grid-template-columns: 1fr 1fr;
      }

      .distribution-summary {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .parameter-panel {
        min-height: auto;
      }

      .parameter-breakdown,
      .parameter-distribution {
        min-height: auto;
      }

      .side-panel {
        min-height: auto;
      }

      .recommendation-insights-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));

  <script>
    const apiBase = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const initialSeedTrackId = urlParams.get("seed") || "";
    const initialSeedCulture = urlParams.get("culture") || "";
    const initialLocalAudioId = urlParams.get("local") || "";
    const apiPreferCuda = ["1", "true", "yes"].includes(String(urlParams.get("cuda") || "").toLowerCase());
    const appConfigKey = "echo-app-config";
    const lastStartupTrackKey = "echo-last-startup-track";
    const stationStateKey = "echo-music-station-state";
    const pendingLocalPlayKey = "echo-pending-local-play";
    const localAudioDbName = "echo-local-audio";
    const localAudioStore = "tracks";
    const mysteryPlace = {
      country: t("music.mysteryPlace.country"),
      city: t("music.mysteryPlace.city"),
      lat: 0,
      lng: -160,
      precision: t("music.mysteryPlace.precision")
    };
    let geoData = null;

    function geoLookupKey(value) {
      const raw = String(value || "").toLowerCase().trim();
      const deaccented = raw.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return deaccented.replace(/[^a-z0-9]+/g, " ").trim() || raw;
    }

    async function loadGeoData() {
      try {
        const response = await fetch("./data/country-capitals.json", { cache: "force-cache" });
        if (!response.ok) throw new Error(`geo data ${response.status}`);
        const data = await response.json();
        if (!data?.countries || !data?.country_aliases) throw new Error("invalid geo data");
        geoData = data;
      } catch (error) {
        console.warn("Geo data unavailable; using built-in fallback", error);
        geoData = null;
      }
    }

    function openLocalAudioDb() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const request = indexedDB.open(localAudioDbName, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(localAudioStore)) {
            db.createObjectStore(localAudioStore, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
      });
    }

    async function getLocalAudioRecord(id) {
      const db = await openLocalAudioDb();
      const record = await new Promise((resolve, reject) => {
        const transaction = db.transaction(localAudioStore, "readonly");
        const request = transaction.objectStore(localAudioStore).get(id);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error("IndexedDB read failed"));
      });
      db.close();
      return record;
    }

    function isoCodeForCountryName(name) {
      const text = String(name || "").trim();
      if (!text) return "";
      const upper = text.toUpperCase();
      if (geoData?.countries?.[upper]) return upper;
      const geoAlias = geoData?.country_aliases?.[geoLookupKey(text)];
      if (geoAlias) return String(geoAlias).toUpperCase();
      if (countryIsoCodes.includes(upper)) return upper;
      for (const code of countryIsoCodes) {
        if (countryNameLookupFn(code) === text) return code;
      }
      return "";
    }

    function localizedCapital(code) {
      const geoCountry = geoData?.countries?.[String(code || "").toUpperCase()];
      if (geoCountry) {
        return {
          city: geoCountry.capital || geoCountry.country,
          lat: Number(geoCountry.lat),
          lng: Number(geoCountry.lng),
          precision: geoCountry.precision || "capital"
        };
      }
      const entry = capitalLookup[code];
      if (!entry) return null;
      return { city: t("music.city." + entry.cityKey), lat: entry.lat, lng: entry.lng };
    }

    function cityLocationForName(name, countryIso = "") {
      const key = geoLookupKey(name);
      const isoHint = String(countryIso || "").toUpperCase().trim();
      const city = (isoHint && geoData?.city_country_aliases?.[`${key}|${isoHint}`])
        || geoData?.city_aliases?.[key];
      if (!city) return null;
      const iso = String(city.country_iso || "").toUpperCase();
      return {
        city: city.city || String(name || "").trim(),
        country: countryNameLookupFn(iso) || iso,
        countryIso: iso,
        lat: Number(city.lat),
        lng: Number(city.lng)

      return { ...fallback, precision: fallback.precision || t("music.precision.capitalFallback") };
    }

    function formatOrigin(track) {
      if (track.country === mysteryPlace.country) {
        return t("music.desc.songFrom") + t("music.mysteryPlace.country");
      }
      const parts = [track.country, track.province, track.city]
        .map(cleanMetaText)
        .filter(Boolean)
        .filter((part, index, all) => all.indexOf(part) === index);
      if (parts.some((part) => /[A-Za-z_]/.test(String(part)))) {
        return parts.join(" / ");
      }
      return parts.join("");
    }

    function displayGenre(track) {
      const raw = track.raw || {};
      return cleanMetaText(track.genre)
        || cleanMetaText(track.primaryGenreName)
        || cleanMetaText(raw.primaryGenreName)
        || cleanMetaText(raw.primary_genre_name)
        || cleanMetaText(track.label)
        || cleanMetaText(track.style)
        || firstTagValue(track.tags || raw.tags)
        || t("music.default.unknown");
    }

    function displaySource(track) {
      const raw = track.raw || {};
      const value = cleanMetaText(track.platform)
        || cleanMetaText(track.sourceDataset)
        || cleanMetaText(track.source)
        || cleanMetaText(raw.platform)
        || cleanMetaText(raw.source_dataset)
        || cleanMetaText(raw.source);
      if (/itunes/i.test(value)) return "iTunes";
      if (/jamendo/i.test(value)) return "Jamendo";
      if (/upload|local|本地|用户|收藏夹/i.test(value) || track.fileObjectUrl || track.localAudioId) return t("music.source.userUpload");
      return value || t("music.default.unknown");
    }

    function playbackTrackLabel(track = currentTrack) {
      return `${track.title || t("music.default.noTrack")} - ${track.artist || t("music.default.unknown")}`;
    }

    function syncTopCover() {
      if (!els.topCover) return;
      const url = currentTrack.coverArtUrl || currentTrack.cover_art_url || "";
      if (url) {
        els.topCover.style.backgroundImage = `url("${String(url).replace(/"/g, "%22")}")`;
        els.topCover.textContent = "";
      } else {
        els.topCover.style.backgroundImage = "";
        els.topCover.textContent = "";
      }
    }

    function isSameTrack(a, b) {
      if (!a || !b) return false;
      const aId = a.trackId || a.id;
      const bId = b.trackId || b.id;
      if (aId && bId) return aId === bId;
      return a.title === b.title && a.artist === b.artist && a.country === b.country;
    }

    function readAppConfig() {
      try {
        const parsed = JSON.parse(localStorage.getItem(appConfigKey) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function startupTrackMode() {
      const mode = readAppConfig().startupTrackMode;
      return ["last", "favorite-random", "library-random", "none"].includes(mode) ? mode : "library-random";
    }

    function getRecommendCount() {
      const raw = Number(readAppConfig().recommendCount);
      return raw >= 1 && raw <= 30 ? raw : 10;
    }

    function startupTrackSnapshot(track = currentTrack) {
      if (!track?.title || track.title === t("music.default.connecting") || track.title === t("music.default.noTrack")) {
        return null;
      }
      if (track.fileObjectUrl && !track.localAudioId) {
        return null;
      }
      const allowed = [
        "trackId", "track_id", "localAudioId", "title", "artist", "album", "country", "city", "province",
        "capital", "lat", "lng", "locationPrecision", "culture", "sourceDataset", "platform", "genre",
        "label", "style", "note", "metrics", "durationSeconds", "releaseDate", "releaseYear", "era", "language", "coverArtUrl", "platformTrackUrl",
        "fullTrackUrl", "previewUrl", "audioUrl", "audioIsPreview", "description", "descriptionEn", "albumDescription", "tags", "tagsEn", "aiDescription", "fromFavorites"
      ];
      return allowed.reduce((snapshot, key) => {
        if (track[key] !== undefined && track[key] !== null && track[key] !== "") {
          snapshot[key] = track[key];
        }
        return snapshot;
      }, { savedAt: new Date().toISOString() });
    }

    function persistLastStartupTrack() {
      const snapshot = startupTrackSnapshot(currentTrack);
      if (!snapshot) return;
      try {
        localStorage.setItem(lastStartupTrackKey, JSON.stringify(snapshot));
      } catch (error) {
        console.warn(error);
      }
    }

    function compactTrackSnapshot(track) {
      const snapshot = startupTrackSnapshot(track);
      if (!snapshot) return null;
      return {
        ...snapshot,
        trackId: snapshot.trackId || snapshot.track_id || track.trackId || track.track_id || "",
        metrics: snapshot.metrics || defaultMetrics
      };
    }

    function clearMusicStationState() {
      try {
        localStorage.removeItem(stationStateKey);
      } catch (error) {
        console.warn(error);
      }
    }

    function persistMusicStationState() {
      if (!recommendationsPersistable || !activeRecommendations.length) return;
      const activeSnapshot = activeRecommendations.map(compactTrackSnapshot).filter(Boolean);
      if (!activeSnapshot.length) return;
      const snapshot = {
        version: 1,
        savedAt: new Date().toISOString(),
        primaryTrack: compactTrackSnapshot(primaryTrack),
        currentTrack: compactTrackSnapshot(currentTrack),
        activeRecommendations: activeSnapshot,
        currentQueueIndex,
        centerLng,
        centerLat,
        mapZoom,
        mapStatus: els.mapStatus?.textContent || "",
        mapMode: els.mapMode?.textContent || "",
        uploadedAudioMeta,
        aiConversationMessages: aiConversationMessages.slice(-12).map((message) => ({
          role: message.role,
          content: message.content,
          displayContent: message.displayContent || "",
          reasoningContent: message.reasoningContent || "",
          thinkingMode: normalizeAiMode(message.thinkingMode),
          reasoningOpen: Boolean(message.reasoningOpen)
        }))
      };
      try {
        localStorage.setItem(stationStateKey, JSON.stringify(snapshot));
      } catch (error) {
        console.warn(error);
      }
    }

    function readMusicStationState() {
      try {
        const saved = JSON.parse(localStorage.getItem(stationStateKey) || "null");
        if (!saved || saved.version !== 1 || !Array.isArray(saved.activeRecommendations)) return null;
        if (!saved.activeRecommendations.length) return null;
        return saved;
      } catch (error) {
        return null;
      }
    }

    function getPlaybackQueue() {
      return [primaryTrack, ...activeRecommendations];
    }

    function replaceCurrentTrack(track) {
      Object.keys(currentTrack).forEach((key) => {
        delete currentTrack[key];
      });
      Object.assign(currentTrack, {
        province: "",
        capital: "",
        note: "",
        metrics: defaultMetrics,
        ...track
      });
    }

    function localTrackFromFile(file, metadata = {}) {
      const title = String(metadata.title || file.name.replace(/\.[^.]+$/, "") || t("music.local.audio")).trim();
      const genre = cleanMetaText(metadata.genre || metadata.primaryGenreName || metadata.label);
      const releaseDate = cleanMetaText(metadata.releaseDate || metadata.release_date || metadata.date);
      return {
        localAudioId: metadata.id || metadata.localAudioId || "",
        title,
        artist: metadata.artist || t("music.local.uploadArtist"),
        city: metadata.city || mysteryPlace.city,
        province: metadata.province || "",
        country: metadata.country || mysteryPlace.country,
        capital: "",
        lat: Number.isFinite(Number(metadata.lat)) ? Number(metadata.lat) : mysteryPlace.lat,
        lng: Number.isFinite(Number(metadata.lng)) ? Number(metadata.lng) : mysteryPlace.lng,
        locationPrecision: metadata.locationPrecision || mysteryPlace.precision,
        culture: metadata.culture || "",
        sourceDataset: metadata.sourceDataset || metadata.source || "upload",
        platform: metadata.platform || "upload",
        genre,
        releaseDate,
        releaseYear: parseReleaseYear(metadata.releaseYear || metadata.release_year || metadata.year || releaseDate),
        era: cleanMetaText(metadata.era),
        language: cleanMetaText(metadata.language || metadata.lang),
        label: genre,
        style: metadata.style || t("music.local.waitingAnalysis"),
        note: metadata.note || t("music.local.loadedNote"),
        metrics: {
          ...defaultMetrics,
          serendipity: 0.5,
          calibrationKl: 2.18,
          targetAffinity: 0.15,
          minorityExposure: 0.25,
          palUncertainty: 0.88,
          score: 0.42,
          relevance: 0.5,
          unexpectedness: 0.5
        },
        durationSeconds: 0,
        coverArtUrl: metadata.coverArtUrl || metadata.cover_art_url || "",
        fileObjectUrl: URL.createObjectURL(file)
      };
    }

    function applyLocalAudioFile(file, metadata = {}) {
      if (currentTrack.fileObjectUrl && currentTrack.fileObjectUrl.startsWith("blob:")) {
        URL.revokeObjectURL(currentTrack.fileObjectUrl);
      }
      uploadedAudioFile = file;
      uploadedAudioMeta = {
        name: file.name,
        type: file.type || metadata.fileType || t("music.local.unknownFormat"),
        sizeMB: Number(((file.size || metadata.fileSize || 0) / 1024 / 1024).toFixed(2)),
        lastModified: file.lastModified ? new Date(file.lastModified).toISOString() : "",
        source: metadata.source || t("music.local.uploadSource"),
        fromFavorites: Boolean(metadata.fromFavorites)
      };
      recommendationsPersistable = false;
      activeRecommendations = [];
      clearMusicStationState();
      const track = localTrackFromFile(file, metadata);
      primaryTrack = { ...track };
      currentQueueIndex = 0;
      selectTrack(primaryTrack, { autoplay: false });
    }

    function setPlaybackState(nextPlaying) {
      isPlaying = Boolean(nextPlaying);
      els.playButton.classList.toggle("is-playing", isPlaying);
      els.playState.textContent = playbackTrackLabel(currentTrack);
      if (!els.audio.src) return;
      if (isPlaying) {
        els.audio.play().catch(() => {
          isPlaying = false;
          els.playButton.classList.remove("is-playing");
        });
      } else {
        els.audio.pause();
      }
    }

    function selectTrack(track, options = {}) {
      if (currentTrack.fileObjectUrl && currentTrack.fileObjectUrl.startsWith("blob:")) {
        URL.revokeObjectURL(currentTrack.fileObjectUrl);
      }
      replaceCurrentTrack(track);
      const loc = locateTrack(currentTrack);
      centerLng = loc.lng;
      centerLat = loc.lat;
      currentQueueIndex = Math.max(0, getPlaybackQueue().findIndex((item) => isSameTrack(item, currentTrack)));
      simulatedSeconds = 0;

      const audioSrc = currentTrack.fileObjectUrl || currentTrack.audioUrl || "";
      if (audioSrc) {
        if (els.audio.src !== audioSrc) {
          els.audio.src = audioSrc;
          els.audio.currentTime = 0;
        }
      } else {
        if (els.audio.src) {
          els.audio.pause();
          els.audio.removeAttribute("src");
          els.audio.load();
        }
      }
      setPlaybackState(Boolean(options.autoplay));

      if (!activeRecommendations.length && !isSameTrack(currentTrack, primaryTrack)) {
        activeRecommendations = recommendations.map(localizeDefaultRec);
      }

      syncTrackReadouts();
      renderRecommendations();
      renderParameterPanel();
      drawMap();
      updateProgressUI();
      persistLastStartupTrack();
      persistMusicStationState();
      hydrateTrackCountries([currentTrack, primaryTrack, ...activeRecommendations]);
    }

    function playQueueDelta(delta) {
      const queue = getPlaybackQueue();
      const shouldContinuePlaying = isPlaying;
      currentQueueIndex = (currentQueueIndex + delta + queue.length) % queue.length;
      selectTrack(queue[currentQueueIndex], { autoplay: shouldContinuePlaying });
    }

    function formatTime(value) {
      const safeValue = Number.isFinite(value) ? Math.max(0, value) : 0;
      const m = Math.floor(safeValue / 60).toString().padStart(2, "0");
      const s = Math.floor(safeValue % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function getDuration() {
      if (Number.isFinite(els.audio.duration) && els.audio.duration > 0) {
        return els.audio.duration;
      }
      if (Number.isFinite(Number(currentTrack.durationSeconds)) && Number(currentTrack.durationSeconds) > 0) {
        return Number(currentTrack.durationSeconds);
      }
      return defaultDuration;
    }

    function getCurrentTime() {
      if (els.audio.src && Number.isFinite(els.audio.currentTime)) {
        return els.audio.currentTime;
      }
      return simulatedSeconds % getDuration();
    }

    function updateProgressUI() {
      const duration = getDuration();
      const current = getCurrentTime();
      const pct = Math.max(0, Math.min(100, (current / duration) * 100));
      els.progressFill.style.width = `${pct}%`;
      els.progressTrack.setAttribute("aria-valuenow", Math.round(pct).toString());
      els.timeCode.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
    }

    function scrubTo(clientX) {
      const rect = els.progressTrack.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const nextTime = pct * getDuration();
      if (els.audio.src) {
        els.audio.currentTime = nextTime;
      } else {
        simulatedSeconds = nextTime;
      }
      updateProgressUI();
    }

    function activeMetrics() {
      if (!activeRecommendations.length) {
        return emptyMetrics;
      }
      return currentTrack.metrics || defaultMetrics;
    }

    function formatPct(value) {
      return `${Math.round(Number(value) * 100)}%`;
    }

    function renderParameterMetrics() {
      const metrics = activeMetrics();
      const isWaitingForRecommendation = !activeRecommendations.length;
      const cards = [
        {
          label: t("music.param.serendipity"),
          code: "01",
          value: isWaitingForRecommendation ? "0%" : Number(metrics.serendipity).toFixed(3),
          sub: t("music.param.serendipityDesc")
        },
        {
          label: t("music.param.calibrationKl"),
          code: "02",
          value: isWaitingForRecommendation ? "0%" : Number(metrics.calibrationKl).toFixed(2),
          sub: t("music.param.calibrationKlDesc")
        },
        {
          label: t("music.param.targetAffinity"),
          code: "03",
          value: formatPct(metrics.targetAffinity),
          sub: t("music.param.targetAffinityDesc")
        },
        {
          label: t("music.param.minorityExposure"),
          code: "04",
          value: formatPct(metrics.minorityExposure),
          sub: t("music.param.minorityExposureDesc"),
          dark: true
        }
      ];

      els.parameterMetrics.innerHTML = cards.map((card) => `
        <article class="parameter-metric${card.dark ? " is-dark" : ""}">
          <div class="parameter-metric-head">
            <span class="meta-label">${card.label}</span>
            <span class="meta-label">${card.code}</span>
          </div>
          <div>
            <div class="parameter-value">${card.value}</div>
            <div class="parameter-sub">${card.sub}</div>
          </div>
        </article>
      `).join("");
    }

    function coverMarkup(item, className = "insight-cover") {
      const title = escapeHtml(item?.title || t("music.cover.recommended"));
      const url = item?.coverArtUrl || item?.cover_art_url || item?.raw?.cover_art_url_large || item?.raw?.cover_art_url || "";
      if (url) {
        return `<img class="${className}" src="${escapeHtml(url)}" alt="${title}${t("music.cover.suffix")}" loading="lazy">`;
      }
      return `<div class="${className} insight-cover-fallback" aria-label="${title}${t("music.cover.suffix")}">ECHO</div>`;
    }

    function groupedInsightRows(items, getKey, limit = 3) {
      const total = items.length;
      const groups = new Map();
      items.forEach((item, index) => {
        const label = getKey(item, index) || t("music.default.unknown");
        if (!groups.has(label)) {
          groups.set(label, { label, count: 0, items: [], firstIndex: index });
        }
        const group = groups.get(label);
        group.count += 1;
        group.items.push(item);
      });
      return [...groups.values()]
        .sort((a, b) => b.count - a.count || a.firstIndex - b.firstIndex || a.label.localeCompare(b.label, window.EchoI18n?.currentLanguage || "zh-CN"))
        .slice(0, limit)
        .map((row, index) => ({
          ...row,
          pct: total ? row.count / total : 0,
          accent: index === 0,
          item: row.items.find((item) => item.coverArtUrl) || row.items[0]
        }));
    }

    function releaseYearForTrack(item) {
      return parseReleaseYear(
        item.releaseYear || item.release_year || item.year || item.releaseDate || item.release_date || item.releasedate
          || item.raw?.release_year || item.raw?.release_date || item.raw?.releaseDate || item.raw?.releasedate
          || item.raw?.year || item.raw?.collection_release_date
      );
    }

    function eraLabelForTrack(item) {
      const era = cleanMetaText(item.era || item.raw?.era);
      if (!era) return "";
      const normalized = era.toLowerCase();
      const labels = {
        traditional: t("music.era.traditional"),
        modern: t("music.era.modern"),
        contemporary: t("music.era.contemporary"),
        mixed: t("music.era.mixed")
      };
      return labels[normalized] || era;
    }

    function eraBucket(item) {
      const year = releaseYearForTrack(item);
      if (year >= 2020) return { key: t("music.era.after2020"), html: `2020<br>${t("music.era.after2020")}` };
      if (year) {
        const start = Math.floor(year / 10) * 10;
        return { key: `${start}-${start + 9}`, html: `${start}<br>-<br>${start + 9}` };
      }
      const era = eraLabelForTrack(item);
      if (era) return { key: `${era}${t("music.era.yearSuffix")}`, html: `${escapeHtml(era)}<br>${t("music.era.yearSuffix")}` };
      return { key: t("music.era.unknownEra"), html: `${t("music.era.unknownEra")}<br>${t("music.era.yearSuffix")}` };
    }

    function renderEraCard(items) {
      const rows = groupedInsightRows(items, (item) => eraBucket(item).key, 3)
        .map((row) => ({ ...row, html: eraBucket(row.item).html }));
      const body = rows.length
        ? `<div class="era-timeline">${rows.map((row, index) => `
            <div class="era-row is-rank-${index + 1}${row.accent ? " is-top" : ""}">
              <div class="era-label">${row.accent ? `<span class=\"top-label\">${t("music.insight.top")}</span>` : ""}${row.html}</div>
              <span class="era-dot" aria-hidden="true"></span>
              ${coverMarkup(row.item)}
              <div class="era-count">${row.count}${t("music.insight.songCount")}</div>
            </div>
          `).join("")}</div>`
        : `<div class="insight-empty">${t("music.insight.emptyEra")}</div>`;
      return `
        <article class="insight-card insight-era" aria-label="${t("music.insight.eraTitle")}">
          <div class="insight-card-title">${t("music.insight.eraTitle")}</div>
          <div class="insight-card-body">${body}</div>
        </article>
      `;
    }

    function renderGenreCard(items) {
      const rows = groupedInsightRows(items, chartGenreLabel, 5);
      if (!rows.length) {
        return `
          <article class="insight-card insight-genre" aria-label="${t("music.insight.genreTitle")}">
            <div class="insight-card-title">${t("music.insight.genreTitle")}</div>
            <div class="insight-card-body"><div class="insight-empty">${t("music.insight.emptyGenre")}</div></div>
          </article>
        `;
      }
      const top = rows[0];
      const topTrack = top.item || items[0] || {};
      const topTrackLabel = [topTrack.title, topTrack.artist].map(cleanMetaText).filter(Boolean).join(" / ");
      const maxCount = Math.max(...rows.map((row) => row.count), 1);
      return `
        <article class="insight-card insight-genre" aria-label="${t("music.insight.genreTitle")}">
          <div class="insight-card-title">${t("music.insight.genreTitle")}</div>
          <div class="insight-card-body">
            <div class="genre-hero">
              <div class="insight-top"><span class="insight-spark" aria-hidden="true"></span><span>${t("music.insight.top")}</span></div>
              <div class="genre-title">${escapeHtml(top.label)}</div>
              <div class="genre-sub">${escapeHtml(topTrackLabel || t("music.insight.waitingTracks"))}</div>
            </div>
            <div class="genre-bars">
              ${rows.map((row) => `
                <div class="genre-bar-row">
                  <div class="genre-bar-track">
                    <div class="genre-bar" style="--bar-width:${Math.max(24, (row.count / maxCount) * 100).toFixed(1)}%">${escapeHtml(row.label)}</div>
                  </div>
                  <div class="genre-percent">${formatPct(row.pct)}</div>
                </div>
              `).join("")}
            </div>
          </div>
        </article>
      `;
    }

    function chartGenreLabel(item) {
      const text = displayGenre(item);
      return text.split(/[\/|,，、;]/).map((part) => part.trim()).filter(Boolean)[0] || text;
    }

    function renderRecommendationInsights() {
      const items = activeRecommendations;
      if (!items.length) {
        els.recommendationInsights.classList.add("is-empty");
        els.recommendationInsights.innerHTML = `
          <div class="insights-empty-bar">${t("music.insight.emptyGenre")}${t("music.insight.emptyEra")}</div>
        `;
        return;
      }
      els.recommendationInsights.classList.remove("is-empty");
      els.recommendationInsights.innerHTML = [
        renderEraCard(items),
        renderGenreCard(items)
      ].join("");
    }

    function renderParameterPanel() {
      renderParameterMetrics();
      renderRecommendationInsights();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function t(key, params = {}) {
      return window.EchoI18n?.t(key, params) || key;
    }

    function aiResponseLanguageName() {
      return window.EchoI18n?.promptLanguageName() || "中文";
    }

    function summarizeTrack(track) {
      const loc = locateTrack(track);
      return {
        title: track.title,
        artist: track.artist,
        origin: formatOrigin(track),
        country: track.country,
        city: track.city || "",
        style: displayGenre(track),
        source: displaySource(track),
        description: track.why || track.note || "",
        coordinates: { lat: loc.lat, lng: loc.lng, precision: loc.precision },
        metrics: track.metrics || defaultMetrics
      };
    }

    function buildAiPayload() {
      const metrics = activeMetrics();
      return {
        project: "Echo Cross-Cultural Music Recommendation",
        timestamp: new Date().toISOString(),
        dataNote: "Frontend sends track info, recommendation list, map positions and parameter readings; audio binaries are not uploaded to the model.",
        uploadedFile: uploadedAudioMeta || "No local audio uploaded; using backend mainline library seed.",
        seedTrack: summarizeTrack(primaryTrack),
        currentTrack: summarizeTrack(currentTrack),
        recommendationStatus: activeRecommendations.length ? `${activeRecommendations.length} recommendations generated` : "No cross-cultural recommendations yet",
        recommendations: activeRecommendations.map((item, index) => ({
          index: index + 1,
          ...summarizeTrack(item)
        })),
        parameters: {
          serendipity: Number(metrics.serendipity),
          calibrationKl: Number(metrics.calibrationKl),
          targetAffinity: Number(metrics.targetAffinity),
          minorityExposure: Number(metrics.minorityExposure),
          dcasScore: Number(metrics.score),
          relevance: Number(metrics.relevance),
          unexpectedness: Number(metrics.unexpectedness),
          palUncertainty: Number(metrics.palUncertainty),
          userAlignmentKl: Number(metrics.userAlignmentKl)
        },
        rerankWeights: rerankWeights.map((item) => ({
          name: item.label,
          weight: item.value,
          signal: item.signal
        })),
        mapState: {
          centerLng,
          centerLat,
          currentTrackLocation: locateTrack(currentTrack),
          recommendationLocations: activeRecommendations.map((item) => ({
            title: item.title,
            origin: formatOrigin(item),
            coordinates: locateTrack(item)
          }))
        }
      };
    }

    function buildAiInitialPrompt(extraQuestion = "") {
      const responseLanguage = aiResponseLanguageName();
      const followup = extraQuestion ? `\n\n${t("music.ai.followup")}: ${extraQuestion}` : "";
      return `Below is the complete data from this Echo recommendation. Please explain this recommendation to the user in a conversational tone.

Respond in ${responseLanguage}.

Cover roughly these points, but don't follow a rigid order:
1. Briefly describe the user's selected song — what's notable about it, where it comes from.
2. How does the overall recommendation set feel — are the styles close or quite different? Why do these songs work together?

4. If any song is particularly "unexpected" — a style the user might not have explored — mention it as a potential surprise.
5. End casually by asking the user one or two questions, like which region they'd like to explore deeper, or if they want a different direction.

Tone: like a friend chatting, not a report. Use short sentences, conversational language. If mentioning recommendation parameters, translate them into everyday feelings.

Recommendation data:
${JSON.stringify(buildAiPayload(), null, 2)}${followup}`;

    function buildKimiRequestPayload(messages, options = {}) {
      const { apiKey, model, endpoint } = getKimiConfig();
      const payload = {
        model,
        endpoint,
        messages: toKimiMessages(messages),
        thinking_mode: normalizeAiMode(options.thinkingMode),
        max_completion_tokens: options.maxCompletionTokens || 8192,
        timeout_seconds: options.timeoutSeconds || 180
      };
      if (apiKey) {
        payload.api_key = apiKey;
      }
      return payload;
    }

    async function requestKimi(messages, options = {}) {
      const payload = buildKimiRequestPayload(messages, options);

      const response = await fetch("/api/ai/kimi/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`${t("music.status.kimiFailed")}${response.status} ${errorText}`);
      }

      const data = await response.json();
      const content = data?.content || data?.choices?.[0]?.message?.content;
      if (!content) {
        throw new Error(t("music.ai.noText"));
      }
      return content;
    }

    function parseSseBlock(block) {
      const lines = String(block || "").split(/\r?\n/);
      let eventName = "message";
      const dataLines = [];
      lines.forEach((line) => {
        if (!line || line.startsWith(":")) return;
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim() || "message";
          return;
        }
        if (line.startsWith("data:")) {
          dataLines.push(line.slice(5).replace(/^\s/, ""));
        }
      });
      if (!dataLines.length) return null;
      const dataText = dataLines.join("\n");
      if (dataText === "[DONE]") {
        return { eventName: "done", data: { ok: true } };
      }
      try {
        return { eventName, data: JSON.parse(dataText) };
      } catch (error) {
        return { eventName, data: { text: dataText } };
      }
    }

    async function requestKimiStream(messages, options = {}, handlers = {}) {
      const payload = buildKimiRequestPayload(messages, options);
      const response = await fetch("/api/ai/kimi/chat/stream", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`${t("music.status.kimiFailed")}${response.status} ${errorText}`);
      }
      if (!response.body) {
        throw new Error(t("music.ai.fetchFailed"));
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let reasoningContent = "";

      function handleBlock(block) {
        const parsed = parseSseBlock(block);
        if (!parsed) return;
        const { eventName, data } = parsed;
        if (eventName === "error") {
          throw new Error(`${t("music.status.kimiFailed")}${data.status || ""} ${data.detail || data.text || ""}`.trim());
        }
        if (eventName === "reasoning") {
          const delta = String(data.delta || "");
          if (!delta) return;
          reasoningContent += delta;
          handlers.onReasoning?.(reasoningContent, delta);
          return;
        }
        if (eventName === "content" || eventName === "message") {
          const delta = String(data.delta || data.text || "");
          if (!delta) return;
          content += delta;
          handlers.onContent?.(content, delta);
          return;
        }
        if (eventName === "done") {
          handlers.onDone?.(data);
        }
      }

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const blocks = buffer.split(/\r?\n\r?\n/);
          buffer = blocks.pop() || "";
          blocks.forEach(handleBlock);
        }
        buffer += decoder.decode();
        if (buffer.trim()) {
          handleBlock(buffer);
        }
      } finally {
        reader.releaseLock();
      }

      if (!content.trim()) {
        throw new Error(t("music.ai.noText"));
      }
      return { content, reasoningContent };
    }

    function kimiErrorMessage(error) {
      const raw = String(error?.message || error);
      if (raw.includes("Failed to fetch")) {
        return t("music.ai.fetchFailed");
      }
      return raw;
    }

    const descriptionCacheKey = "echo-recommendation-descriptions";
    let descriptionHydrationRun = 0;
    let kimiDescriptionAvailable = null;

    function readDescriptionCache() {
      try {
        const data = JSON.parse(localStorage.getItem(descriptionCacheKey) || "{}");
        return data && typeof data === "object" ? data : {};
      } catch (error) {
        return {};
      }
    }

    function writeDescriptionCache(cache) {
      try {
        localStorage.setItem(descriptionCacheKey, JSON.stringify(cache));
      } catch (_) { /* storage full or private mode */ }

    function descriptionKey(item) {
      return String(item.trackId || `${item.title}::${item.artist}::${item.album}`).trim();
    }

    function metadataDescription(item) {
      const useEn = !isChineseLang();
      const desc = useEn ? (item.descriptionEn || item.description) : item.description;
      const trackDescription = String(desc || "").trim();
      if (trackDescription) {
        return { text: trackDescription, source: "track" };
      }
      const albumDescription = String(item.albumDescription || "").trim();
      if (albumDescription) {
        return { text: albumDescription, source: "album" };
      }
      return null;
    }

    function conciseText(value, maxLength = 260) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (text.length <= maxLength) return text;
      return `${text.slice(0, maxLength - 1).trim()}…`;
    }

    function fallbackDescription(item) {
      const parts = [
        item.album ? `${t("music.desc.albumPrefix")}${item.album}${t("music.desc.albumSuffix")}` : "",
        item.label ? `${t("music.desc.genre")} ${item.label}` : "",
        item.culture ? `${t("music.desc.culture")} ${cultureLabel(item.culture) || item.culture}` : "",
        item.tags ? `${t("music.desc.tags")} ${item.tags}` : ""
      ].filter(Boolean);
      if (parts.length) {
        return `${t("music.desc.songFrom")}${item.artist || t("music.default.unknown")}，${parts.join("，")}${t("music.desc.candidateSuffix")}`;
      }
      return `${t("music.desc.songFrom")}${item.artist || t("music.default.unknown")}${t("music.desc.candidateSuffix")}`;
    }

    function recommendationDescription(item) {
      const fromMetadata = metadataDescription(item);
      if (fromMetadata) return conciseText(fromMetadata.text);
      if (item.aiDescription) return conciseText(item.aiDescription);
      if (item.descriptionLoading) return t("music.recommend.running");
      return conciseText(fallbackDescription(item));
    }

    async function canUseKimiDescriptions() {
      if (kimiDescriptionAvailable !== null) return kimiDescriptionAvailable;
      const config = getKimiConfig();
      if (config.apiKey) {
        kimiDescriptionAvailable = true;

      }
      try {
        const response = await fetch("/api/ai/kimi/status");
        if (!response.ok) {
          kimiDescriptionAvailable = false;
          return false;
        }
        const data = await response.json();
