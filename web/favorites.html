<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo | 收藏夹</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #666666;
      --light: #999999;
      --line: #e5e5e5;
      --line-soft: #f0f0f0;
      --card: #f7f7f7;
      --card-hover: #f0f0f0;
      --grid-gap: 4px;
      --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
      --font-main: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-main);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    label {
      font: inherit;
    }

    button,
    label {
      cursor: pointer;
    }

    .library-header {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 2rem;
      align-items: center;
      width: min(calc(100% - 80px), 1600px);
      margin: 0 auto;
      padding: 2.5rem 0;
      background: var(--bg);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
      font-weight: 500;
    }

    .brand-mark {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1;
    }

    .brand-sub,
    .meta-label {
      color: var(--light);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.1rem;
      padding: 0.55rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      white-space: nowrap;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 260ms var(--ease-out);
    }

    .pill:hover,
    .pill.is-active {
      background: var(--ink);
      color: #ffffff;
      border-color: var(--ink);
      transform: scale(1.04);
    }

    .library-shell {
      width: min(calc(100% - 80px), 1600px);
      margin: 0 auto 4rem;
      background: transparent;
    }

    .library-hero {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--grid-gap);
      margin-bottom: var(--grid-gap);
      background: transparent;
    }

    .hero-copy,
    .hero-panel {
      min-height: 20rem;
      padding: 2rem;
      border: 0;
      border-radius: 0;
      background: var(--card);
      overflow: hidden;
    }

    .hero-copy {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-panel {
      grid-column: span 2;
      position: relative;
      background:
        linear-gradient(135deg, rgba(17, 17, 17, 0.04), transparent 52%),
        var(--card);
    }

    .hero-panel::before {
      content: "收藏索引 / 2026";
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: var(--light);
      font-family: var(--font-mono);
      font-size: 0.84rem;
      letter-spacing: 0.1em;
    }

    .hero-panel::after {
      content: "声纹索引";
      position: absolute;
      top: 3.6rem;
      right: 2rem;
      max-width: 5ch;
      color: rgba(17, 17, 17, 0.045);
      font-size: clamp(4.5rem, 8vw, 8.6rem);
      font-weight: 200;
      line-height: 0.88;
      text-align: right;
      pointer-events: none;
    }

    .hero-copy h1 {
      margin-top: 1.1rem;
      max-width: 13ch;
      font-size: clamp(4.8rem, 8vw, 8.4rem);
      font-weight: 200;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .hero-copy p {
      max-width: 37rem;
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .hero-panel {
      display: grid;
      align-content: end;
      gap: var(--grid-gap);
    }

    .hero-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--grid-gap);
      position: relative;
      z-index: 1;
    }

    .hero-stat {
      min-height: 10.5rem;
      padding: 1.25rem;
      border: 0;
      border-radius: 0;
      background: transparent;
      display: grid;
      align-content: space-between;
      gap: 1rem;
    }

    .hero-stat .meta-label {
      color: var(--ink);
      font-size: 0.84rem;
    }

    .hero-stat strong {
      font-size: clamp(4rem, 5vw, 5.9rem);
      font-weight: 200;
      line-height: 0.86;
      letter-spacing: -0.03em;
    }

    .toolbar {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--grid-gap);
      align-items: stretch;
      padding: 0;
      margin-bottom: var(--grid-gap);
      background: transparent;
    }

    .toolbar .pill {
      min-height: 9.5rem;
      border-color: var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: #ffffff;
      align-items: end;
      justify-content: flex-start;
      padding: 1.5rem;
      font-size: 1rem;
      transform: none;
    }

    .upload-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .toolbar .control:first-of-type {
      grid-column: span 2;
    }

    .toolbar .control:nth-of-type(3),
    .toolbar .control:nth-of-type(4) {
      grid-column: span 2;
    }

    .control {
      display: grid;
      align-content: space-between;
      gap: 1.2rem;
      min-width: 0;
      min-height: 9.5rem;
      padding: 1.35rem 1.5rem;
      border: 0;
      border-radius: 0;
      background: var(--card);
      transition: background 220ms ease;
    }

    .control .meta-label {
      font-size: 0.86rem;
    }

    .control:hover {
      background: var(--card-hover);
    }

    .control input,
    .control select {
      width: 100%;
      min-height: 2.4rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      outline: none;
      font-size: clamp(1.05rem, 1.5vw, 1.55rem);
      font-weight: 300;
      letter-spacing: 0;
    }

    .select-control {
      position: relative;
    }

    .select-control.is-customized select {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .select-trigger {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      min-height: 2.4rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      text-align: left;
      font-size: clamp(1.05rem, 1.5vw, 1.55rem);
      font-weight: 300;
      letter-spacing: 0;
    }

    .select-control.is-customized .select-trigger {
      display: flex;
    }

    .select-caret {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 1.1rem;
      line-height: 1;
      transition: transform 180ms var(--ease-out);
    }

    .select-control.is-open .select-caret {
      transform: rotate(180deg);
    }

    .select-menu {
      display: none;
      position: absolute;
      z-index: 50;
      top: calc(100% + var(--grid-gap));
      left: 0;
      right: 0;
      max-height: 22rem;
      overflow: auto;
      background: #ffffff;
      border-top: 1px solid var(--ink);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.12);
    }

    .select-control.is-open .select-menu {
      display: block;
    }

    .select-option {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 3.25rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      padding: 0.8rem 1rem;
      text-align: left;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0;
    }

    .select-option:hover,
    .select-option.is-selected {
      background: var(--ink);
      color: #ffffff;
    }

    .control input:focus,
    .control select:focus {
      box-shadow: inset 0 -1px 0 var(--ink);
    }

    .masonry-wrap {
      padding: 0;
      background: transparent;
    }

    .masonry-grid {
      position: relative;
      min-height: 20rem;
      background: transparent;
    }

    .masonry-grid.has-empty {
      display: grid;
      min-height: 18rem;
    }

    .track-card {
      display: grid;
      align-content: start;
      gap: 1.1rem;
      min-height: 0;
      padding: 1rem;
      border: 0;
      border-radius: 0;
      background: var(--card);
      overflow: visible;
      position: relative;
      transform-origin: top left;
      color: var(--ink);
      transition: background 300ms var(--ease-out), color 300ms var(--ease-out);
    }

    .track-card:hover {
      background: var(--card-hover);
      z-index: 5;
    }

    .track-card.is-horizontal {
      grid-template-columns: minmax(260px, 0.48fr) minmax(280px, 0.52fr);
      align-items: start;
      gap: 1rem;
    }

    .track-card.is-compact-90 {
      --compact-scale: 0.9;
    }

    .track-card.is-compact-75 {
      --compact-scale: 0.75;
    }

    .track-card.is-compact-60 {
      --compact-scale: 0.6;
    }

    .track-card.is-dark {
      background: var(--ink);
      color: #ffffff;
    }

    .track-card.is-dark:hover {
      background: #000000;
    }

    .track-card.is-dark .meta-label,
    .track-card.is-dark .track-info p,
    .track-card.is-dark .tag,
    .track-card.is-dark .track-open,
    .track-card.is-dark .terminal-block {
      color: #888888;
    }

    .track-card.is-dark .tag,
    .track-card.is-dark .terminal-block {
      border-color: #333333;
    }

    .arrow-icon {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 2;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      transition: opacity 180ms ease, transform 260ms var(--ease-out);
    }

    .track-card:hover .arrow-icon {
      opacity: 0;
      transform: translate(4px, -4px);
    }

    .remove-track {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      z-index: 6;
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid rgba(17, 17, 17, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms var(--ease-out), background 180ms ease;
    }

    .track-card:hover .remove-track {
      opacity: 1;
      pointer-events: auto;
    }

    .remove-track:hover {
      background: var(--ink);
      color: #ffffff;
      transform: scale(1.06);
    }

    .track-card.is-dark .remove-track {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.95);
      color: var(--ink);
    }

    .cover-shell {
      display: block;
      width: 100%;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: #ffffff;
      position: relative;
    }

    .cover {
      width: 100%;
      height: auto;
      max-height: none;
      display: block;
      background:
        linear-gradient(135deg, rgba(17, 17, 17, 0.08), rgba(17, 17, 17, 0.02)),
        #ffffff;
      object-fit: contain;
      filter: grayscale(100%) contrast(1.08);
      transition: filter 380ms ease;
    }

    .track-card:hover .cover {
      filter: grayscale(0%) contrast(1);
    }

    .track-card.is-color .cover {
      filter: saturate(1.16) contrast(1.03);
    }

    .cover-fallback {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .track-info {
      display: grid;
      align-content: space-between;
      gap: 1.2rem;
      min-width: 0;
      min-height: 0;
      padding: 0.1rem 0.1rem 0;
    }

    .track-card.is-horizontal .track-info {
      align-content: space-between;
      padding: 1rem 1rem 0.2rem 0;
    }

    .track-info h2 {
      max-width: calc(100% - 1.8rem);
      margin-top: 0.9rem;
      font-size: clamp(1.65rem, 2vw, 2.4rem);
      font-weight: 300;
      line-height: 1.06;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .track-card.is-horizontal .track-info h2 {
      margin-top: 0.9rem;
      font-size: clamp(2rem, 2.4vw, 3rem);
      font-weight: 200;
    }

    .track-card.is-horizontal .track-info p {
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .track-card.is-horizontal .tag-row {
      gap: 0.25rem;
    }

    .track-card.is-horizontal .tag {
      font-size: 0.56rem;
      padding-inline: 0.5rem;
    }

    .track-card.is-horizontal .terminal-block {
      margin-top: 1.1rem;
      padding-top: 1rem;
      font-size: 0.68rem;
    }

    .track-info p {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.2rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 1.45rem;
      padding: 0.22rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 0;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-open {
      display: inline-flex;
      width: max-content;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      transition: color 180ms ease;
    }

    .track-open:hover {
      color: var(--ink);
    }

    .terminal-block {
      width: 100%;
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: #333333;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      line-height: 1.55;
    }

    .prompt::before {
      content: "-> ";
      color: var(--light);
    }

    .empty-state {
      min-height: 18rem;
      display: grid;
      place-items: center;
      grid-column: 1 / -1;
      border: 0;
      border-radius: 0;
      background: var(--card);
      color: var(--muted);
      padding: 2rem;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      .library-header {
        grid-template-columns: 1fr;
        width: min(calc(100% - 28px), 1600px);
        padding: 1.6rem 0;
        letter-spacing: 0.03em;
      }

      .library-shell {
        width: min(calc(100% - 28px), 1600px);
      }

      .toolbar,
      .masonry-grid {
        grid-template-columns: 1fr;
      }

      .library-hero {
        grid-template-columns: 1fr;
      }

      .hero-copy,
      .hero-panel {
        grid-column: span 1;
        min-height: auto;
        padding: 1.5rem;
      }

      .hero-copy h1 {
        font-size: 3.6rem;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .toolbar .control:first-of-type,
      .toolbar .control:nth-of-type(3),
      .toolbar .control:nth-of-type(4) {
        grid-column: span 1;
      }

      .toolbar .pill,
      .control {
        min-height: 7.5rem;
      }

      .track-card.is-horizontal {
        grid-column: span 1;
        grid-template-columns: 1fr;
      }

      .track-card.is-horizontal .track-info h2 {
        font-size: 1.65rem;
      }

      .hero-stat-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-i18n-title="favorites.title">
  <header class="library-header">
    <a class="brand" href="index.html" aria-label="Echo 主页" data-i18n-aria-label="common.brand.homeAria">
      <span class="brand-mark">Echo</span>
      <span class="brand-sub" data-i18n="favorites.brandSub">收藏夹</span>
    </a>
    <div></div>
    <nav class="top-actions" aria-label="主导航">
      <a class="pill" href="music.html" data-i18n="common.nav.music">音乐台</a>
      <a class="pill is-active" href="favorites.html" data-i18n="common.nav.favorites">收藏夹</a>
      <a class="pill" href="settings.html" data-i18n="common.nav.settings">设置界面</a>
    </nav>
  </header>

  <main class="library-shell">
    <section class="library-hero" aria-label="收藏夹总览">
      <div class="hero-copy">
        <div class="meta-label" data-i18n="favorites.heroMeta">曲库界面</div>
        <h1 data-i18n-html="favorites.heroTitle">声音<br>收藏夹</h1>
        <p data-i18n="favorites.heroCopy">把来自 iTunes、Jamendo 与上传音频的曲目整理成可浏览、可筛选、可继续接入推荐反馈的音乐集合。</p>
      </div>
      <div class="hero-panel">
        <div class="hero-stat-grid" aria-label="曲库统计">
          <article class="hero-stat">
            <span class="meta-label" data-i18n="favorites.stat.tracks">曲目</span>
            <strong id="stat-count">--</strong>
          </article>
          <article class="hero-stat">
            <span class="meta-label" data-i18n="favorites.stat.cultures">文化域</span>
            <strong id="stat-culture">--</strong>
          </article>
          <article class="hero-stat">
            <span class="meta-label" data-i18n="favorites.stat.covers">封面</span>
            <strong id="stat-cover">--</strong>
          </article>
        </div>
      </div>
    </section>

    <section class="toolbar" aria-label="收藏夹工具栏">
      <label class="pill" for="favorite-import" data-i18n="favorites.import">点击导入歌曲</label>
      <input class="upload-input" id="favorite-import" type="file" accept="audio/mpeg,audio/mp4,audio/aac,audio/wav,audio/x-wav,audio/flac,audio/ogg,audio/opus,audio/webm,.mp3,.m4a,.mp4,.aac,.wav,.wave,.flac,.ogg,.oga,.opus,.webm,.aif,.aiff,.wma" multiple>

      <div class="control">
        <label class="meta-label" for="search-input" data-i18n="favorites.searchLabel">歌曲检索</label>
        <input id="search-input" type="search" placeholder="曲名 / 创作者 / 流派" data-i18n-placeholder="favorites.searchPlaceholder">
      </div>

      <div class="control">
        <label class="meta-label" for="culture-filter" data-i18n="favorites.cultureFilter">文化筛选</label>
        <select id="culture-filter">
          <option value="" data-i18n="favorites.allCultures">全部文化域</option>
        </select>
      </div>

      <div class="control">
        <label class="meta-label" for="source-filter" data-i18n="favorites.sourceFilter">来源筛选</label>
        <select id="source-filter">
          <option value="" data-i18n="favorites.allSources">全部来源</option>
          <option value="favorite" data-i18n="favorites.source.favorite">收藏</option>
          <option value="itunes">iTunes</option>
          <option value="jamendo">Jamendo</option>
          <option value="upload" data-i18n="favorites.localUpload">本地导入</option>
        </select>
      </div>

      <div class="control">
        <label class="meta-label" for="sort-select" data-i18n="favorites.sortLabel">歌曲排序</label>
        <select id="sort-select">
          <option value="shuffle" data-i18n="favorites.sort.shuffle">随机漫游</option>
          <option value="title" data-i18n="favorites.sort.title">曲名 A-Z</option>
          <option value="artist" data-i18n="favorites.sort.artist">创作者 A-Z</option>
          <option value="culture" data-i18n="favorites.sort.culture">文化域</option>
          <option value="source" data-i18n="favorites.sort.source">来源</option>
        </select>
      </div>
    </section>

    <section class="masonry-wrap" aria-label="收藏曲目">
      <div class="masonry-grid" id="masonry-grid"></div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="favorite-store.js"></script>
  <script>
    const els = {
      grid: document.getElementById("masonry-grid"),
      search: document.getElementById("search-input"),
      culture: document.getElementById("culture-filter"),
      source: document.getElementById("source-filter"),
      sort: document.getElementById("sort-select"),
      import: document.getElementById("favorite-import"),
      statCount: document.getElementById("stat-count"),
      statCulture: document.getElementById("stat-culture"),
      statCover: document.getElementById("stat-cover")
    };

    let catalog = [];
    let imported = [];
    let storedFavorites = [];
    let shuffleSeed = 17;
    const visualSeed = Math.floor(Math.random() * 1000003);
    const removedStorageKey = "echo-favorite-hidden-tracks";
    const customSelects = new Map();
    let masonryResizeObserver = null;
    let masonryResizeFrame = 0;
    let removedTrackIds = readRemovedTrackIds();

    function t(key, params = {}) {
      return window.EchoI18n?.t(key, params) || key;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function cultureLabel(culture) {
      if (!culture) return t("favorites.unknownCulture");
      const translated = t(`culture.${culture}`);
      return translated === `culture.${culture}` ? culture : translated;
    }

    function itemTitle(item) {
      return item.title || item.id || t("favorites.unknownTrack");
    }

    function itemArtist(item) {
      if (item.artist) return item.artist;
      return item.imported ? t("favorites.localUpload") : t("favorites.unknownArtist");
    }

    function itemGenre(item) {
      return item.genre || cultureLabel(item.culture) || t("favorites.unknownGenre");
    }

    function itemKey(item) {
      return String(
        window.EchoFavoriteStore?.trackKey?.(item) ||
        item?.track_id ||
        item?.trackId ||
        item?.id ||
        `${itemTitle(item)}::${itemArtist(item)}::${item.album || ""}`
      ).trim();
    }

    function readRemovedTrackIds() {
      try {
        const parsed = JSON.parse(localStorage.getItem(removedStorageKey) || "[]");
        return new Set(Array.isArray(parsed) ? parsed.map(String) : []);
      } catch (error) {
        return new Set();
      }
    }

    function writeRemovedTrackIds() {
      localStorage.setItem(removedStorageKey, JSON.stringify([...removedTrackIds]));
    }

    function normalizeItem(item, index = 0) {
      return {
        id: item.id || item.track_id || `track_${index}`,
        title: item.title || item.track_id || "",
        artist: item.artist || item.source_dataset || "",
        genre: item.label || "",
        culture: item.culture || "",
        source: item.source_dataset || item.platform || "catalog",
        cover: item.cover_art_url_large || item.cover_art_url || item.artwork_url_large || item.image_url || "",
        url: item.platform_track_url || item.full_track_url || item.preview_url || "",
        description: item.description || item.album_description || "",
        favorite: Boolean(item.favorite),
        imported: false
      };
    }

    function seededScore(text) {
      let n = shuffleSeed;
      for (const ch of String(text)) {
        n = (n * 31 + ch.charCodeAt(0)) % 1000003;
      }
      return n;
    }

    function visualScore(item, index, salt = 0) {
      let n = (visualSeed + index * 997 + salt * 131) % 1000003;
      for (const ch of String(item.id || itemTitle(item))) {
        n = (n * 33 + ch.charCodeAt(0)) % 1000003;
      }
      return n;
    }

    function filteredItems() {
      const query = els.search.value.trim().toLowerCase();
      const culture = els.culture.value;
      const source = els.source.value;
      const seen = new Set();
      let items = [...imported, ...storedFavorites, ...catalog].filter((item) => {
        const key = itemKey(item);
        if (key && removedTrackIds.has(key)) return false;
        if (key && seen.has(key)) return false;
        if (key) seen.add(key);
        const hay = `${itemTitle(item)} ${itemArtist(item)} ${itemGenre(item)} ${cultureLabel(item.culture)} ${item.source}`.toLowerCase();
        if (query && !hay.includes(query)) return false;
        if (culture && item.culture !== culture) return false;
        if (source === "favorite" && !item.favorite) return false;
        if (source && source !== "favorite" && item.source !== source) return false;
        return true;
      });

      const sort = els.sort.value;
      if (sort === "title") items.sort((a, b) => itemTitle(a).localeCompare(itemTitle(b)));
      else if (sort === "artist") items.sort((a, b) => itemArtist(a).localeCompare(itemArtist(b)));
      else if (sort === "culture") items.sort((a, b) => cultureLabel(a.culture).localeCompare(cultureLabel(b.culture)));
      else if (sort === "source") items.sort((a, b) => a.source.localeCompare(b.source));
      else items.sort((a, b) => seededScore(a.id) - seededScore(b.id));
      return items;
    }

    function coverMarkup(item) {
      const media = item.cover
        ? `<img class="cover" src="${escapeHtml(item.cover)}" alt="${escapeHtml(itemTitle(item))}" loading="lazy">`
        : `<div class="cover cover-fallback">${escapeHtml(t("favorites.noCover"))}</div>`;
      if (item.cover) {
        return item.url
          ? `<a class="cover-shell" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${media}</a>`
          : `<div class="cover-shell">${media}</div>`;
      }
      return `<div class="cover-shell">${media}</div>`;
    }

    function cardMarkup(item, index) {
      const visual = visualScore(item, index, 11);
      const horizontal = !item.imported && visual % 5 === 0;
      const dark = !horizontal && visual % 17 === 4;
      const color = Boolean(item.cover) && visual % 4 === 0;
      const compactRoll = visualScore(item, index, 29);
      let compactScale = 1;
      if (!item.imported && compactRoll % 43 === 0) compactScale = 0.6;
      else if (!item.imported && compactRoll % 29 === 0) compactScale = 0.75;
      else if (!item.imported && compactRoll % 17 === 0) compactScale = 0.9;
      const compactClass = compactScale === 1 ? "" : `is-compact-${Math.round(compactScale * 100)}`;
      const key = itemKey(item);
      const classes = [
        "track-card",
        horizontal ? "is-horizontal" : "is-vertical",
        dark ? "is-dark" : "",
        color ? "is-color" : "",
        compactClass
      ].filter(Boolean).join(" ");
      const platformLink = item.url
        ? `<a class="track-open" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(t("favorites.openPlatform"))}</a>`
        : `<span class="track-open">${escapeHtml(t("favorites.localTrack"))}</span>`;
      return `
        <article class="${classes}" data-track-id="${escapeHtml(key)}" data-span="${horizontal ? 2 : 1}" data-scale="${compactScale}">
          <button class="remove-track" type="button" data-remove-id="${escapeHtml(key)}" aria-label="${escapeHtml(t("favorites.removeTrack"))}">×</button>
          ${item.url ? `<span class="arrow-icon" aria-hidden="true">↗</span>` : ""}
          ${coverMarkup(item)}
          <div class="track-info">
            <div>
              <div class="meta-label">${escapeHtml(item.source)}</div>
              <h2>${escapeHtml(itemTitle(item))}</h2>
              <p>${escapeHtml(itemArtist(item))}</p>
              ${item.description ? `<p>${escapeHtml(item.description)}</p>` : ""}
            </div>
            <div>
              <div class="tag-row">
                <span class="tag">${escapeHtml(itemGenre(item))}</span>
                <span class="tag">${escapeHtml(cultureLabel(item.culture))}</span>
              </div>
              <div class="terminal-block"><span class="prompt">${platformLink}</span></div>
            </div>
          </div>
        </article>
      `;
    }

    function queueMasonryResize() {
      cancelAnimationFrame(masonryResizeFrame);
      masonryResizeFrame = requestAnimationFrame(resizeMasonryItems);
    }

    function resizeMasonryItems() {
      const cards = Array.from(els.grid.querySelectorAll(".track-card"));
      if (!cards.length) {
        els.grid.style.height = "";
        return;
      }
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--grid-gap")) || 4;
      const width = els.grid.clientWidth;
      const columnCount = width < 760 ? 1 : width < 1180 ? 2 : width < 1480 ? 3 : 4;
      const columnWidth = (width - gap * (columnCount - 1)) / columnCount;
      const heights = Array(columnCount).fill(0);

      cards.forEach((card) => {
        const scale = Math.max(0.6, Math.min(1, Number(card.dataset.scale) || 1));
        const requestedSpan = Math.max(1, Number(card.dataset.span) || 1);
        const span = Math.min(columnCount, requestedSpan);
        const slotWidth = columnWidth * span + gap * (span - 1);

        card.style.position = "absolute";
        card.style.width = `${slotWidth / scale}px`;
        card.style.transform = `scale(${scale})`;

        const visualHeight = Math.max(40, card.getBoundingClientRect().height);
        let bestColumn = 0;
        let bestTop = Number.POSITIVE_INFINITY;
        for (let column = 0; column <= columnCount - span; column += 1) {
          const top = Math.max(...heights.slice(column, column + span));
          if (top < bestTop) {
            bestTop = top;
            bestColumn = column;
          }
        }

        const left = bestColumn * (columnWidth + gap);
        const top = Number.isFinite(bestTop) ? bestTop : 0;
        card.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
        for (let column = bestColumn; column < bestColumn + span; column += 1) {
          heights[column] = top + visualHeight + gap;
        }
      });

      els.grid.style.height = `${Math.max(...heights)}px`;
    }

    function observeMasonryItems() {
      if (masonryResizeObserver) masonryResizeObserver.disconnect();
      if (!("ResizeObserver" in window)) return;
      masonryResizeObserver = new ResizeObserver(queueMasonryResize);
      els.grid.querySelectorAll(".track-card").forEach((card) => masonryResizeObserver.observe(card));
    }

    function scheduleMasonryPasses() {
      [0, 120, 360, 900, 1800, 3200].forEach((delay) => {
        window.setTimeout(queueMasonryResize, delay);
      });
    }

    function render() {
      const items = filteredItems();
      const cultures = new Set(items.map((item) => item.culture).filter(Boolean));
      const withCover = items.filter((item) => item.cover).length;
      els.statCount.textContent = String(items.length);
      els.statCulture.textContent = String(cultures.size);
      els.statCover.textContent = `${Math.round((withCover / Math.max(1, items.length)) * 100)}%`;

      if (!items.length) {
        els.grid.classList.add("has-empty");
        els.grid.innerHTML = `<div class="empty-state">${escapeHtml(t("favorites.empty"))}</div>`;
        els.grid.style.height = "";
        return;
      }
      els.grid.classList.remove("has-empty");
      els.grid.innerHTML = items.map(cardMarkup).join("");
      observeMasonryItems();
      scheduleMasonryPasses();
      els.grid.querySelectorAll("img").forEach((img) => {
        img.addEventListener("load", queueMasonryResize);
        img.addEventListener("error", queueMasonryResize);
        if (img.complete) queueMasonryResize();
        if (img.decode) img.decode().then(queueMasonryResize).catch(queueMasonryResize);
      });
    }

    function populateCultures(items) {
      const values = [...new Set(items.map((item) => item.culture).filter(Boolean))].sort();
      const current = els.culture.value;
      els.culture.innerHTML = `<option value="">${escapeHtml(t("favorites.allCultures"))}</option>` + values.map((culture) => (
        `<option value="${escapeHtml(culture)}">${escapeHtml(cultureLabel(culture))}</option>`
      )).join("");
      els.culture.value = values.includes(current) ? current : "";
      renderCustomSelect(els.culture);
    }

    async function loadCatalog() {
      els.grid.innerHTML = `<div class="empty-state">${escapeHtml(t("favorites.loading"))}</div>`;
      const response = await fetch("/api/mainline/catalog?limit=160&random_seed=20260525&exclude_low_signal=true");
      if (!response.ok) {
        throw new Error(`catalog ${response.status}`);
      }
      const data = await response.json();
      catalog = (data.items || []).map(normalizeItem);
      loadStoredFavorites();
      populateCultures(catalog);
      render();
    }

    function loadStoredFavorites() {
      storedFavorites = (window.EchoFavoriteStore?.read() || []).map((item, index) => ({
        ...normalizeItem(item, index),
        favorite: true
      }));
    }

    function importFiles(files) {
      const next = Array.from(files || []).map((file, index) => {
        const title = file.name.replace(/\.[^.]+$/, "");
        return {
          id: `upload_${Date.now()}_${index}`,
          title,
          artist: "",
          genre: file.type || "audio",
          culture: "",
          source: "upload",
          cover: "",
          url: "",
          imported: true
        };
      });
      imported = [...next, ...imported];
      els.source.value = "";
      render();
    }

    function removeTrack(removeId) {
      if (!removeId) return;
      const current = [...imported, ...storedFavorites, ...catalog];
      const target = current.find((item) => itemKey(item) === removeId);
      imported = imported.filter((item) => itemKey(item) !== removeId);
      if (target?.favorite) {
        window.EchoFavoriteStore?.remove?.(target);
        loadStoredFavorites();
      }
      removedTrackIds.add(removeId);
      writeRemovedTrackIds();
      render();
    }

    function setupCustomSelect(select) {
      const control = select.closest(".control");
      if (!control || customSelects.has(select)) return;
      control.classList.add("select-control", "is-customized");

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "select-trigger";
      trigger.setAttribute("aria-haspopup", "listbox");
      trigger.setAttribute("aria-expanded", "false");
      trigger.innerHTML = `<span class="select-value"></span><span class="select-caret" aria-hidden="true">⌄</span>`;

      const menu = document.createElement("div");
      menu.className = "select-menu";
      menu.setAttribute("role", "listbox");

      select.insertAdjacentElement("afterend", trigger);
      trigger.insertAdjacentElement("afterend", menu);
      customSelects.set(select, { control, trigger, menu });

      trigger.addEventListener("click", () => {
        const shouldOpen = !control.classList.contains("is-open");
        closeCustomSelects(select);
        control.classList.toggle("is-open", shouldOpen);
        trigger.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
      });

      select.addEventListener("change", () => renderCustomSelect(select));
      renderCustomSelect(select);
    }

    function closeCustomSelects(except = null) {
      customSelects.forEach(({ control, trigger }, select) => {
        if (select === except) return;
        control.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      });
    }

    function renderCustomSelect(select) {
      const state = customSelects.get(select);
      if (!state) return;
      const { trigger, menu } = state;
      const valueText = trigger.querySelector(".select-value");
      const options = Array.from(select.options);
      const selected = options.find((option) => option.value === select.value) || options[0];
      valueText.textContent = selected ? selected.textContent : "";
      menu.innerHTML = options.map((option) => `
        <button
          class="select-option${option.value === select.value ? " is-selected" : ""}"
          type="button"
          role="option"
          aria-selected="${option.value === select.value ? "true" : "false"}"
          data-value="${escapeHtml(option.value)}"
        >${escapeHtml(option.textContent || "")}</button>
      `).join("");
      menu.querySelectorAll(".select-option").forEach((button) => {
        button.addEventListener("click", () => {
          select.value = button.dataset.value || "";
          closeCustomSelects();
          select.dispatchEvent(new Event("change", { bubbles: true }));
        });
      });
    }

    function setupCustomSelects() {
      [els.culture, els.source, els.sort].forEach(setupCustomSelect);
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".select-control")) closeCustomSelects();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeCustomSelects();
      });
    }

    [els.search, els.culture, els.source, els.sort].forEach((control) => {
      control.addEventListener("input", render);
      control.addEventListener("change", render);
    });
    els.import.addEventListener("change", (event) => importFiles(event.target.files));
    els.grid.addEventListener("click", (event) => {
      const removeButton = event.target.closest("[data-remove-id]");
      if (!removeButton) return;
      event.preventDefault();
      event.stopPropagation();
      removeTrack(removeButton.dataset.removeId);
    });
    window.addEventListener("resize", resizeMasonryItems);
    window.addEventListener("echo-favorites-change", () => {
      loadStoredFavorites();
      render();
    });
    window.addEventListener("echo-language-change", () => {
      loadStoredFavorites();
      populateCultures(catalog);
      [els.source, els.sort].forEach(renderCustomSelect);
      render();
    });

    setupCustomSelects();
    loadCatalog().catch((error) => {
      console.error(error);
      loadStoredFavorites();
      if (storedFavorites.length) {
        populateCultures(storedFavorites);
        render();
        return;
      }
      els.grid.innerHTML = `<div class="empty-state">${escapeHtml(t("favorites.loadFailed"))}</div>`;
    });
  </script>
</body>
</html>
