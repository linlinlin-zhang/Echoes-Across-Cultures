<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Echo 收藏夹 — 浏览、筛选和管理来自 iTunes、Jamendo 与上传音频的跨文化音乐收藏。">
  <title>Echo | 收藏夹</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23111111'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ffffff' stroke-width='4'/%3E%3Cpath d='M18 32h28' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #666666;
      --light: #999999;
      --line: #e5e5e5;
      --line-soft: #f0f0f0;
      --card: #f7f7f7;
      --card-hover: #f0f0f0;
      --grid-gap: 4px;
      --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
      --font-main: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-main);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    label {
      font: inherit;
    }

    button,
    label {
      cursor: pointer;
    }

    .library-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.2rem;
      align-items: center;
      width: 100%;
      min-height: 4.55rem;
      margin: 0;
      padding: 0 1.65rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      text-transform: none;
      letter-spacing: 0;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 0.7rem;
      min-width: 0;
      font-weight: 400;
    }

    .brand-mark {
      font-size: 2rem;
      font-weight: 400;
      line-height: 1;
    }

    .brand-sub,
    .meta-label {
      color: var(--light);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.65rem;
      padding: 0 1.35rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 400;
      text-transform: none;
      white-space: nowrap;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .pill:hover,
    .pill.is-active {
      background: var(--ink);
      color: #ffffff;
      border-color: var(--ink);
      transform: translateY(-1px);
    }

    .library-shell {
      width: min(calc(100% - 80px), 1600px);
      margin: 2.4rem auto 4rem;
      background: transparent;
    }

    .library-hero {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--grid-gap);
      margin-bottom: var(--grid-gap);
      background: transparent;
    }

    .hero-copy,
    .hero-panel {
      min-height: 20rem;
      padding: 2rem;
      border: 0;
      border-radius: 0;
      background: var(--card);
      overflow: hidden;
    }

    .hero-copy {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-panel {
      grid-column: span 2;
      position: relative;
      background:
        linear-gradient(135deg, rgba(17, 17, 17, 0.04), transparent 52%),
        var(--card);
    }

    .hero-panel::before {
      content: var(--favorites-hero-panel-index, "收藏索引");
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: var(--light);
      font-family: var(--font-mono);
      font-size: 0.84rem;
      letter-spacing: 0.1em;
    }

    .hero-panel::after {
      content: var(--favorites-hero-panel-music, "音乐索引");
      position: absolute;
      top: 3.6rem;
      right: 2rem;
      max-width: 5ch;
      color: rgba(17, 17, 17, 0.045);
      font-size: clamp(4.5rem, 8vw, 8.6rem);
      font-weight: 200;
      line-height: 0.88;
      text-align: right;
      pointer-events: none;
    }

    .hero-copy h1 {
      margin-top: 1.1rem;
      max-width: 13ch;
      font-size: clamp(4.8rem, 8vw, 8.4rem);
      font-weight: 200;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .hero-copy p {
      max-width: 37rem;
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .hero-panel {
      display: grid;
      align-content: end;
      gap: var(--grid-gap);
    }

    .hero-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--grid-gap);
      position: relative;
      z-index: 1;
    }

    .hero-stat {
      min-height: 10.5rem;
      padding: 1.25rem;
      border: 0;
      border-radius: 0;
      background: transparent;
      display: grid;
      align-content: space-between;
      gap: 1rem;
    }

    .hero-stat .meta-label {
      color: var(--ink);
      font-size: 0.84rem;
    }

    .hero-stat strong {
      font-size: clamp(4rem, 5vw, 5.9rem);
      font-weight: 200;
      line-height: 0.86;
      letter-spacing: -0.03em;
    }

    .toolbar {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--grid-gap);
      align-items: stretch;
      padding: 0;
      margin-bottom: var(--grid-gap);
      background: transparent;
    }

    .toolbar .pill {
      min-height: 9.5rem;
      border-color: var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: #ffffff;
      align-items: end;
      justify-content: flex-start;
      padding: 1.5rem;
      font-size: 1rem;
      transform: none;
    }

    .upload-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .import-picker,
    .library-picker {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
    }

    .import-picker[hidden],
    .library-picker[hidden] {
      display: none;
    }

    .import-dialog,
    .library-dialog {
      width: min(100%, 880px);
      max-height: min(82vh, 760px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      border: 1px solid var(--ink);
      background: #ffffff;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.14);
    }

    .import-dialog {
      grid-template-rows: auto auto;
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .dialog-head h2 {
      margin-top: 0.35rem;
      font-size: clamp(1.35rem, 2.5vw, 2rem);
      font-weight: 400;
      line-height: 1;
    }

    .import-choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--grid-gap);
      padding: var(--grid-gap);
      background: var(--line-soft);
    }

    .import-choice {
      min-height: 14rem;
      display: grid;
      align-content: end;
      gap: 0.8rem;
      padding: 1.5rem;
      border: 0;
      background: #ffffff;
      color: var(--ink);
      text-align: left;
      transition: background 180ms ease, color 180ms ease;
    }

    .import-choice:hover {
      background: var(--ink);
      color: #ffffff;
    }

    .import-choice span {
      font-size: clamp(1.6rem, 4vw, 3rem);
      font-weight: 300;
      line-height: 1;
    }

    .import-choice small {
      color: currentColor;
      opacity: 0.62;
      font-size: 0.9rem;
    }

    .library-search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .library-search-row input {
      width: 100%;
      min-height: 3.2rem;
      border: 1px solid var(--ink);
      background: #ffffff;
      padding: 0 1rem;
      outline: none;
      font-size: 1rem;
    }

    .library-results {
      min-height: 18rem;
      max-height: 52vh;
      overflow: auto;
      background: #ffffff;
    }

    .library-result,
    .library-status,
    .library-load-marker {
      width: 100%;
      min-height: 5.9rem;
      display: grid;
      grid-template-columns: 4.4rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1.5rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      text-align: left;
    }

    .library-result:hover {
      background: var(--card-hover);
    }

    .library-status,
    .library-load-marker {
      grid-template-columns: 1fr;
      min-height: 4rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }

    .library-result-cover {
      width: 4.4rem;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--card);
      border: 1px solid var(--line);
    }

    .library-result-cover.is-empty {
      display: grid;
      place-items: center;
      color: var(--light);
      font-family: var(--font-mono);
      font-size: 0.68rem;
    }

    .library-result-main {
      min-width: 0;
      display: grid;
      gap: 0.35rem;
    }

    .library-result-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1.02rem;
    }

    .library-result-meta {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .library-result-action {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .toolbar .control:first-of-type {
      grid-column: span 2;
    }

    .toolbar .control:nth-of-type(3),
    .toolbar .control:nth-of-type(4) {
      grid-column: span 2;
    }

    .control {
      display: grid;
      align-content: space-between;
      gap: 1.2rem;
      min-width: 0;
      min-height: 9.5rem;
      padding: 1.35rem 1.5rem;
      border: 0;
      border-radius: 0;
      background: var(--card);
      transition: background 220ms ease;
    }

    .control .meta-label {
      font-size: 0.86rem;
    }

    .control:hover {
      background: var(--card-hover);
    }

    .control input,
    .control select {
      width: 100%;
      min-height: 2.4rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      outline: none;
      font-size: clamp(1.05rem, 1.5vw, 1.55rem);
      font-weight: 300;
      letter-spacing: 0;
    }

    .select-control {
      position: relative;
    }

    .select-control.is-customized select {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .select-trigger {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      min-height: 2.4rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 0;
      text-align: left;
      font-size: clamp(1.05rem, 1.5vw, 1.55rem);
      font-weight: 300;
      letter-spacing: 0;
    }

    .select-control.is-customized .select-trigger {
      display: flex;
    }

    .select-caret {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 1.1rem;
      line-height: 1;
      transition: transform 180ms var(--ease-out);
    }

    .select-control.is-open .select-caret {
      transform: rotate(180deg);
    }

    .select-menu {
      display: none;
      position: absolute;
      z-index: 50;
      top: calc(100% + var(--grid-gap));
      left: 0;
      right: 0;
      max-height: 22rem;
      overflow: auto;
      background: #ffffff;
      border-top: 1px solid var(--ink);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.12);
    }

    .select-control.is-open .select-menu {
      display: block;
    }

    .select-option {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 3.25rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      padding: 0.8rem 1rem;
      text-align: left;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0;
    }

    .select-option:hover,
    .select-option.is-selected {
      background: var(--ink);
      color: #ffffff;
    }

    .control input:focus,
    .control select:focus {
      box-shadow: inset 0 -1px 0 var(--ink);
    }

    .masonry-wrap {
      padding: 0;
      background: transparent;
    }

    .masonry-grid {
      position: relative;
      min-height: 20rem;
      background: transparent;
    }

    .masonry-grid.has-empty {
      display: grid;
      min-height: 18rem;
    }

    .track-card {
      display: grid;
      align-content: start;
      gap: 1.1rem;
      --cover-size: 100%;
      min-height: 0;
      padding: 1rem;
      border: 0;
      border-radius: 0;
      background: var(--card);
      overflow: visible;
      position: relative;
      transform-origin: top left;
      color: var(--ink);
      transition: background 300ms var(--ease-out), color 300ms var(--ease-out);
    }

    .track-card:hover {
      background: var(--card-hover);
      z-index: 5;
    }

    .track-card.is-horizontal {
      grid-template-columns: minmax(260px, 0.48fr) minmax(280px, 0.52fr);
      align-items: start;
      gap: 1rem;
    }

    .track-card.is-dark {
      background: var(--ink);
      color: #ffffff;
    }

    .track-card.is-dark:hover {
      background: #000000;
    }

    .track-card.is-dark .meta-label,
    .track-card.is-dark .track-info p,
    .track-card.is-dark .tag,
    .track-card.is-dark .track-open,
    .track-card.is-dark .terminal-block {
      color: #888888;
    }

    .track-card.is-dark .tag,
    .track-card.is-dark .terminal-block {
      border-color: #333333;
    }

    .arrow-icon {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 2;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      transition: opacity 180ms ease, transform 260ms var(--ease-out);
    }

    .track-card:hover .arrow-icon {
      opacity: 0;
      transform: translate(4px, -4px);
    }

    .remove-track {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      z-index: 6;
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid rgba(17, 17, 17, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms var(--ease-out), background 180ms ease;
    }

    .track-card:hover .remove-track {
      opacity: 1;
      pointer-events: auto;
    }

    .remove-track:hover {
      background: var(--ink);
      color: #ffffff;
      transform: scale(1.06);
    }

    .track-card.is-dark .remove-track {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.95);
      color: var(--ink);
    }

    .cover-shell {
      display: block;
      width: var(--cover-size);
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: #ffffff;
      position: relative;
    }

    .track-card.is-horizontal .cover-shell {
      width: var(--cover-size);
    }

    .cover {
      width: 100%;
      height: auto;
      max-height: none;
      display: block;
      background:
        linear-gradient(135deg, rgba(17, 17, 17, 0.08), rgba(17, 17, 17, 0.02)),
        #ffffff;
      object-fit: contain;
      filter: grayscale(100%) contrast(1.08);
      transition: filter 380ms ease;
    }

    .track-card:hover .cover {
      filter: grayscale(100%) contrast(1.08);
    }

    .track-card.is-color .cover {
      filter: saturate(1.16) contrast(1.03);
    }

    .cover-fallback {
      position: relative;
      aspect-ratio: 1 / 1;
      min-height: 14rem;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background:
        radial-gradient(circle at 50% 46%, transparent 0 18%, rgba(17, 17, 17, 0.14) 18.2% 18.9%, transparent 19.2% 30%),
        radial-gradient(circle at 50% 46%, rgba(17, 17, 17, 0.08) 0 0.35rem, transparent 0.36rem),
        linear-gradient(135deg, rgba(17, 17, 17, 0.09), rgba(17, 17, 17, 0.02)),
        #f4f4f4;
      filter: none;
    }

    .cover.cover-fallback {
      filter: none;
    }

    .cover-fallback::before {
      content: "";
      position: absolute;
      width: 42%;
      aspect-ratio: 1;
      border: 1px solid rgba(17, 17, 17, 0.32);
      border-radius: 50%;
      box-shadow:
        0 0 0 1.7rem #ffffff,
        0 0 0 1.76rem rgba(17, 17, 17, 0.12),
        0 0 0 3.25rem rgba(255, 255, 255, 0.62),
        0 0 0 3.31rem rgba(17, 17, 17, 0.08);
    }

    .cover-fallback::after {
      content: "ECHO";
      position: absolute;
      right: 1rem;
      bottom: 0.9rem;
      color: rgba(17, 17, 17, 0.38);
      font-size: 0.76rem;
    }

    .cover-fallback span {
      position: absolute;
      left: 1rem;
      top: 1rem;
      color: rgba(17, 17, 17, 0.48);
    }

    .track-info {
      display: grid;
      align-content: space-between;
      gap: 1.2rem;
      min-width: 0;
      min-height: 0;
      padding: 0.1rem 0.1rem 0;
    }

    .track-card.is-horizontal .track-info {
      align-content: space-between;
      padding: 1rem 1rem 0.2rem 0;
    }

    .track-info h2 {
      max-width: calc(100% - 1.8rem);
      margin-top: 0.9rem;
      font-size: clamp(1.5rem, 1.7vw, 2.05rem);
      font-weight: 300;
      line-height: 1.06;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .track-card.is-horizontal .track-info h2 {
      margin-top: 0.9rem;
      font-size: clamp(1.85rem, 2.05vw, 2.55rem);
      font-weight: 200;
    }

    .track-card.is-horizontal .track-info p {
      font-size: 1.02rem;
      line-height: 1.58;
    }

    .track-card.is-horizontal .tag-row {
      gap: 0.25rem;
    }

    .track-card.is-horizontal .tag {
      font-size: 0.76rem;
      padding-inline: 0.66rem;
    }

    .track-card.is-horizontal .terminal-block {
      margin-top: 1.1rem;
      padding-top: 1rem;
      font-size: 0.78rem;
    }

    .track-info p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.58;
      overflow-wrap: anywhere;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.2rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 1.7rem;
      padding: 0.28rem 0.66rem;
      border: 1px solid var(--line);
      border-radius: 0;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-open {
      display: inline-flex;
      width: max-content;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      transition: color 180ms ease;
    }

    .track-open:hover {
      color: var(--ink);
    }

    .terminal-block {
      width: 100%;
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: #333333;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .prompt::before {
      content: "-> ";
      color: var(--light);
    }

    .empty-state {
      min-height: 18rem;
      display: grid;
      place-items: center;
      grid-column: 1 / -1;
      border: 0;
      border-radius: 0;
      background: var(--card);
      color: var(--muted);
      padding: 2rem;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      .library-header {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 1.2rem 1rem;
      }

      .library-shell {
        width: min(calc(100% - 28px), 1600px);
        margin-top: 1rem;
      }

      .toolbar,
      .masonry-grid {
        grid-template-columns: 1fr;
      }

      .library-hero {
        grid-template-columns: 1fr;
      }

      .hero-copy,
      .hero-panel {
        grid-column: span 1;
        min-height: auto;
        padding: 1.5rem;
      }

      .hero-copy h1 {
        font-size: 3.6rem;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .toolbar .control:first-of-type,
      .toolbar .control:nth-of-type(3),
      .toolbar .control:nth-of-type(4) {
        grid-column: span 1;
      }

      .toolbar .pill,
      .control {
        min-height: 7.5rem;
      }

      .track-card.is-horizontal {
        grid-column: span 1;
        grid-template-columns: 1fr;
      }

      .track-card.is-horizontal .track-info h2 {
        font-size: 1.65rem;
      }

      .hero-stat-grid {
        grid-template-columns: 1fr;
      }

      .import-dialog,

        max-height: 88vh;

      .dialog-head,

        grid-template-columns: 1fr;

      .dialog-head {
        align-items: flex-start;

      }

      .import-choice-grid,
      .library-search-row {

      }

      .library-result {
        grid-template-columns: 3.8rem minmax(0, 1fr);
      }

      .library-result-action {
        grid-column: 2;
      }
    }
  </style>
</head>

  <script src="i18n.js?v=20260623-session-state"></script>
  <script src="favorite-store.js"></script>
  <script>
    const els = {
      grid: document.getElementById("masonry-grid"),
      search: document.getElementById("search-input"),
      culture: document.getElementById("culture-filter"),
      source: document.getElementById("source-filter"),
      sort: document.getElementById("sort-select"),
      importMenu: document.getElementById("favorite-import-menu"),
      import: document.getElementById("favorite-import"),
      importPicker: document.getElementById("import-picker"),
      importClose: document.getElementById("import-picker-close"),
      importUploadChoice: document.getElementById("import-upload-choice"),
      importLibraryChoice: document.getElementById("import-library-choice"),
      libraryPicker: document.getElementById("library-picker"),
      libraryClose: document.getElementById("library-picker-close"),
      librarySearchInput: document.getElementById("library-search-input"),
      librarySearchSubmit: document.getElementById("library-search-submit"),
      libraryResults: document.getElementById("library-results"),
      statCount: document.getElementById("stat-count"),
      statCulture: document.getElementById("stat-culture"),
      statArtist: document.getElementById("stat-artist")
    };

    let catalog = [];
    let imported = [];
    let storedFavorites = [];
    let shuffleSeed = Math.floor(Math.random() * 1000003);
    const visualSeed = Math.floor(Math.random() * 1000003);
    const removedStorageKey = "echo-favorite-hidden-tracks";
    const coverConfigKey = "echo-cover-config";
    const pendingLocalPlayKey = "echo-pending-local-play";
    const localAudioDbName = "echo-local-audio";
    const localAudioStore = "tracks";
    const coverRatios = [10, 20, 30, 40, 50, 60, 70, 80, 90];
    const customSelects = new Map();
    let masonryResizeObserver = null;
    let masonryResizeFrame = 0;
    let removedTrackIds = readRemovedTrackIds();
    let coverConfig = readCoverConfig();
    let librarySearchResults = [];
    let librarySearchQuery = "";
    let librarySearchOffset = 0;
    let libraryHasMore = false;
    let librarySearchBusy = false;
    let librarySearchAbort = null;
    let libraryBrowseSeed = Date.now() % 1000000;
    const libraryPageSize = 24;

    function t(key, params = {}) {
      return window.EchoI18n?.t(key, params) || key;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function safeUrl(value) {
      const str = String(value || "").trim();
      if (/^(https?:\/\/|\/)/i.test(str)) return str;
      return "";
    }

    function openLocalAudioDb() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const request = indexedDB.open(localAudioDbName, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(localAudioStore)) {
            db.createObjectStore(localAudioStore, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
      });
    }

    async function putLocalAudioRecord(record) {
      const db = await openLocalAudioDb();
      await new Promise((resolve, reject) => {
        const transaction = db.transaction(localAudioStore, "readwrite");
        transaction.objectStore(localAudioStore).put(record);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error || new Error("IndexedDB write failed"));
      });
      db.close();
    }

    function cultureLabel(culture) {
      if (!culture) return t("favorites.mysteriousPlace");
      const translated = t(`culture.${culture}`);
      return translated === `culture.${culture}` ? culture : translated;
    }

    function itemTitle(item) {
      return item.title || item.id || t("favorites.unknownTrack");
    }

    function itemArtist(item) {
      if (item.artist) return item.artist;
      return item.imported ? t("favorites.localUpload") : t("favorites.unknownArtist");
    }

    function itemGenre(item) {
      return String(item.genre || "").trim() || t("favorites.unknownGenre");
    }

    function itemPlaceLabel(item) {
      const culture = String(item.culture || "").trim();
      if (culture) return cultureLabel(culture);
      const place = [item.country, item.region, item.province, item.city, item.location]
        .map((part) => String(part || "").trim())
        .filter(Boolean)
        .join(" / ");
      return place || t("favorites.mysteriousPlace");
    }

    function itemDescription(item) {
      return String(item.description || "").trim();
    }

    function itemKey(item) {
      return String(
        window.EchoFavoriteStore?.trackKey?.(item) ||
        item?.track_id ||
        item?.trackId ||
        item?.id ||
        `${itemTitle(item)}::${itemArtist(item)}::${item.album || ""}`
      ).trim();
    }

    function readRemovedTrackIds() {
      try {
        const parsed = JSON.parse(localStorage.getItem(removedStorageKey) || "[]");
        return new Set(Array.isArray(parsed) ? parsed.map(String) : []);
      } catch (error) {
        return new Set();
      }
    }

    function writeRemovedTrackIds() {
      localStorage.setItem(removedStorageKey, JSON.stringify([...removedTrackIds]));
    }

    function readCoverConfig() {
      try {
        const parsed = JSON.parse(localStorage.getItem(coverConfigKey) || "{}");
        const mode = ["color", "mono", "mixed"].includes(parsed.mode) ? parsed.mode : "color";
        const colorRatio = coverRatios.includes(Number(parsed.colorRatio)) ? Number(parsed.colorRatio) : 30;
        return { mode, colorRatio };
      } catch (error) {
        return { mode: "color", colorRatio: 30 };
      }
    }

    function shouldUseColorCover(item, index) {
      if (!item.cover) return false;
      if (coverConfig.mode === "color") return true;
      if (coverConfig.mode === "mono") return false;
      return visualScore(item, index, 43) % 100 < coverConfig.colorRatio;
    }

    function normalizeItem(item, index = 0) {
      return {
        id: item.id || item.track_id || `track_${index}`,
        title: item.title || item.track_id || "",
        artist: item.artist || item.source_dataset || "",
        genre: item.genre || item.label || "",
        culture: item.culture || "",
        country: item.country || item.country_name || "",
        region: item.region || "",
        province: item.province || "",
        city: item.city || "",
        location: item.location || "",
        source: item.source || item.source_dataset || item.platform || "catalog",
        cover: item.cover_art_url_large || item.cover_art_url || item.artwork_url_large || item.image_url || "",
        url: item.platform_track_url || item.full_track_url || item.preview_url || "",
        description: item.description || item.album_description || "",
        favorite: Boolean(item.favorite),
        imported: false,
        raw: item.raw || item
      };
    }

    function seededScore(text) {
      let n = shuffleSeed;
      for (const ch of String(text)) {
        n = (n * 31 + ch.charCodeAt(0)) % 1000003;
      }
      return n;
    }

    function visualScore(item, index, salt = 0) {
      let n = (visualSeed + index * 997 + salt * 131) % 1000003;
      for (const ch of String(item.id || itemTitle(item))) {
        n = (n * 33 + ch.charCodeAt(0)) % 1000003;
      }
      return n;
    }

    function filteredItems() {
      const query = els.search.value.trim().toLowerCase();
      const culture = els.culture.value;
      const source = els.source.value;
      const seen = new Set();
      let items = [...imported, ...storedFavorites, ...catalog].filter((item) => {
        const key = itemKey(item);
        if (key && removedTrackIds.has(key)) return false;
        if (key && seen.has(key)) return false;
        if (key) seen.add(key);
        const hay = `${itemTitle(item)} ${itemArtist(item)} ${itemGenre(item)} ${itemPlaceLabel(item)} ${item.source}`.toLowerCase();
        if (query && !hay.includes(query)) return false;
        if (culture && item.culture !== culture) return false;
        if (source === "favorite" && !item.favorite) return false;
        if (source && source !== "favorite" && item.source !== source) return false;
        return true;
      });

      const sort = els.sort.value;
      if (sort === "title") items.sort((a, b) => itemTitle(a).localeCompare(itemTitle(b)));
      else if (sort === "artist") items.sort((a, b) => itemArtist(a).localeCompare(itemArtist(b)));
      else if (sort === "culture") items.sort((a, b) => itemPlaceLabel(a).localeCompare(itemPlaceLabel(b)));
      else if (sort === "source") items.sort((a, b) => a.source.localeCompare(b.source));
      else items.sort((a, b) => seededScore(a.id) - seededScore(b.id));
      return items;
    }

    function coverMarkup(item) {
      const media = item.cover
        ? `<img class="cover" src="${escapeHtml(item.cover)}" alt="${escapeHtml(itemTitle(item))}" loading="lazy">`
        : `<div class="cover cover-fallback" role="img" aria-label="${escapeHtml(t("favorites.noCover"))}"><span>${escapeHtml(t("favorites.noCover"))}</span></div>`;
      if (item.cover) {
        const href = safeUrl(item.url);
        return href
          ? `<a class="cover-shell" href="${escapeHtml(href)}" target="_blank" rel="noopener">${media}</a>`
          : `<div class="cover-shell">${media}</div>`;
      }
      return `<div class="cover-shell">${media}</div>`;
    }

    function cardMarkup(item, index) {
      const visual = visualScore(item, index, 11);
      const horizontal = !item.imported && visual % 5 === 0;
      const dark = !horizontal && visual % 17 === 4;
      const color = shouldUseColorCover(item, index);
      const compactRoll = visualScore(item, index, 29);
      const canCompact = !item.imported && compactRoll % 5 === 0;
      const key = itemKey(item);
      const description = itemDescription(item);
      const classes = [
        "track-card",
        horizontal ? "is-horizontal" : "is-vertical",
        dark ? "is-dark" : "",
        color ? "is-color" : ""
      ].filter(Boolean).join(" ");
      const platformLink = item.imported
        ? `<a class="track-open" href="music.html?local=${encodeURIComponent(item.localAudioId || key)}" data-local-play-id="${escapeHtml(item.localAudioId || key)}">${escapeHtml(t("favorites.playLocal"))}</a>`
        : safeUrl(item.url)
        ? `<a class="track-open" href="${escapeHtml(safeUrl(item.url))}" target="_blank" rel="noopener">${escapeHtml(t("favorites.openPlatform"))}</a>`
        : `<span class="track-open">${escapeHtml(t("favorites.localTrack"))}</span>`;
      return `
        <article class="${classes}" data-track-id="${escapeHtml(key)}" data-span="${horizontal ? 2 : 1}" data-can-compact="${canCompact ? "true" : "false"}">
          <button class="remove-track" type="button" data-remove-id="${escapeHtml(key)}" aria-label="${escapeHtml(t("favorites.removeTrack"))}">×</button>
          ${(item.url || item.imported) ? `<span class="arrow-icon" aria-hidden="true">↗</span>` : ""}
          ${coverMarkup(item)}
          <div class="track-info">
            <div>
              <div class="meta-label">${escapeHtml(item.source)}</div>
              <h2>${escapeHtml(itemTitle(item))}</h2>
              <p>${escapeHtml(itemArtist(item))}</p>
              ${description ? `<p>${escapeHtml(description)}</p>` : ""}
            </div>
            <div>
              <div class="tag-row">
                <span class="tag">${escapeHtml(itemGenre(item))}</span>
                <span class="tag">${escapeHtml(itemPlaceLabel(item))}</span>
              </div>
              <div class="terminal-block"><span class="prompt">${platformLink}</span></div>
            </div>
          </div>
        </article>
      `;
    }

    function queueMasonryResize() {
      cancelAnimationFrame(masonryResizeFrame);
      masonryResizeFrame = requestAnimationFrame(resizeMasonryItems);
    }

    function resizeMasonryItems() {
      const cards = Array.from(els.grid.querySelectorAll(".track-card"));
      if (!cards.length) {
        els.grid.style.height = "";
        return;
      }
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--grid-gap")) || 4;
      const width = els.grid.clientWidth;
      const columnCount = width < 760 ? 1 : width < 1180 ? 2 : width < 1480 ? 3 : 4;
      const columnWidth = (width - gap * (columnCount - 1)) / columnCount;
      const heights = Array(columnCount).fill(0);

      cards.forEach((card) => {
        const requestedSpan = Math.max(1, Number(card.dataset.span) || 1);
        const span = Math.min(columnCount, requestedSpan);
        const slotWidth = columnWidth * span + gap * (span - 1);

        card.style.position = "absolute";
        card.style.left = "0px";
        card.style.top = "0px";
        card.style.width = `${slotWidth}px`;
        card.style.transform = "none";

        const naturalHeight = Math.max(40, card.getBoundingClientRect().height);
        const canCompact = card.dataset.canCompact === "true" && columnCount > 1;
        let best = {
          column: 0,
          top: Number.POSITIVE_INFINITY,
          scale: 1,
          score: Number.POSITIVE_INFINITY
        };

        for (let column = 0; column <= columnCount - span; column += 1) {
          const top = Math.max(...heights.slice(column, column + span));
          const scale = canCompact ? compactScaleForSlot(heights, column, span, top, naturalHeight, gap) : 1;
          const visualHeight = naturalHeight * scale;
          const nextHeights = heights.slice();
          for (let nextColumn = column; nextColumn < column + span; nextColumn += 1) {
            nextHeights[nextColumn] = top + visualHeight + gap;
          }
          const maxHeight = Math.max(...nextHeights);
          const minHeight = Math.min(...nextHeights);
          const compactPenalty = scale < 0.995 ? 18 : 0;
          const score = (maxHeight - minHeight) + maxHeight * 0.045 + compactPenalty + top * 0.01;
          if (score < best.score) {
            best = { column, top, scale, score };
          }
        }

        const left = best.column * (columnWidth + gap);
        const top = Number.isFinite(best.top) ? best.top : 0;
        const scale = Math.max(0.6, Math.min(1, best.scale || 1));
        const visualHeight = naturalHeight * scale;
        card.style.left = `${left}px`;
        card.style.top = `${top}px`;
        card.style.transform = scale < 0.995 ? `scale(${scale})` : "none";
        card.dataset.compactScale = scale.toFixed(3);
        for (let column = best.column; column < best.column + span; column += 1) {
          heights[column] = top + visualHeight + gap;
        }
      });

      els.grid.style.height = `${Math.max(...heights)}px`;
    }

    function compactScaleForSlot(heights, startColumn, span, top, naturalHeight, gap) {
      const occupied = new Set(Array.from({ length: span }, (_, index) => startColumn + index));
      const nearbyCeilings = heights
        .filter((height, column) => !occupied.has(column) && height > top + gap * 3)
        .sort((a, b) => a - b);
      const target = nearbyCeilings[0];
      const fallbackTarget = Math.max(...heights);
      const targetHeight = (Number.isFinite(target) ? target : fallbackTarget) - top - gap;
      const scale = targetHeight / naturalHeight;
      if (scale >= 0.6 && scale < 0.98) {
        return Math.max(0.6, Math.min(0.98, scale));
      }
      return 1;
    }

    function observeMasonryItems() {
      if (masonryResizeObserver) masonryResizeObserver.disconnect();
      if (!("ResizeObserver" in window)) return;
      masonryResizeObserver = new ResizeObserver(queueMasonryResize);
      els.grid.querySelectorAll(".track-card").forEach((card) => masonryResizeObserver.observe(card));
    }

    function scheduleMasonryPasses() {
      [0, 120, 360, 900, 1800, 3200].forEach((delay) => {
        window.setTimeout(queueMasonryResize, delay);
      });
    }

    function render() {
      const items = filteredItems();
      const cultures = new Set(items.map((item) => item.culture).filter(Boolean));
      const artists = new Set(items.map((item) => itemArtist(item)).filter((artist) => {
        return artist && artist !== t("favorites.unknownArtist") && artist !== t("favorites.localUpload");
      }));
      els.statCount.textContent = String(items.length);
      els.statCulture.textContent = String(cultures.size);
      els.statArtist.textContent = String(artists.size);

      if (!items.length) {
        els.grid.classList.add("has-empty");
        els.grid.innerHTML = `<div class="empty-state">${escapeHtml(t("favorites.empty"))}</div>`;
        els.grid.style.height = "";
        return;
      }
      els.grid.classList.remove("has-empty");
      els.grid.innerHTML = items.map(cardMarkup).join("");
      observeMasonryItems();
      scheduleMasonryPasses();
      els.grid.querySelectorAll("img").forEach((img) => {
        img.addEventListener("load", queueMasonryResize);
        img.addEventListener("error", queueMasonryResize);
        if (img.complete) queueMasonryResize();
        if (img.decode) img.decode().then(queueMasonryResize).catch(queueMasonryResize);
      });
    }

    function populateCultures(items) {
      const values = [...new Set(items.map((item) => item.culture).filter(Boolean))].sort();
      const current = els.culture.value;
      els.culture.innerHTML = `<option value="">${escapeHtml(t("favorites.allCultures"))}</option>` + values.map((culture) => (
        `<option value="${escapeHtml(culture)}">${escapeHtml(cultureLabel(culture))}</option>`
      )).join("");
      els.culture.value = values.includes(current) ? current : "";
      renderCustomSelect(els.culture);
    }

    async function loadCatalog() {
      els.grid.innerHTML = `<div class="empty-state">${escapeHtml(t("favorites.loading"))}</div>`;
      if (window.EchoFavoriteStore?.hydrateFromServer) {
        await window.EchoFavoriteStore.hydrateFromServer({ seed: true }).catch((error) => {
          console.warn("favorite server hydrate failed", error);
        });
      }
      const response = await fetch("/api/mainline/catalog?limit=160&random_seed=20260525&exclude_low_signal=true");
      if (!response.ok) {
        throw new Error(`catalog ${response.status}`);
      }
      const data = await response.json();
      catalog = (data.items || []).map(normalizeItem);
      loadStoredFavorites();
      populateCultures(catalog);
      render();
    }

    function loadStoredFavorites() {
      storedFavorites = (window.EchoFavoriteStore?.read() || []).map((item, index) => ({
        ...normalizeItem(item, index),
        favorite: true
      }));
    }

    function openImportPicker() {
      els.importPicker.hidden = false;
    }

    function closeImportPicker() {
      els.importPicker.hidden = true;
    }

    function openLibraryPicker() {
      closeImportPicker();
      els.libraryPicker.hidden = false;
      window.setTimeout(() => els.librarySearchInput?.focus(), 40);
      if (!librarySearchResults.length) {
        searchLibrary("", { reset: true });
      }
    }

    function closeLibraryPicker() {
      els.libraryPicker.hidden = true;
    }

    function libraryMeta(item) {
      return [
        item.artist,
        item.genre,
        item.country || item.city || item.culture,
        item.source
      ].map((value) => String(value || "").trim()).filter(Boolean).join(" / ");
    }

    function libraryScrollHintText() {
      if (librarySearchBusy && librarySearchResults.length) return "正在加载更多歌曲";
      if (libraryHasMore) return "向下滑动继续加载更多歌曲";
      if (librarySearchResults.length) return "已显示所有匹配歌曲";
      return "";
    }

    function renderLibraryResults() {
      if (!librarySearchResults.length) {
        els.libraryResults.innerHTML = `<div class="library-status">${escapeHtml(librarySearchBusy ? "正在搜索曲库" : "没有找到匹配歌曲")}</div>`;
        return;
      }
      els.libraryResults.innerHTML = librarySearchResults.map((item, index) => {
        const cover = safeUrl(item.cover)
          ? `<img class="library-result-cover" src="${escapeHtml(safeUrl(item.cover))}" alt="${escapeHtml(item.title)} 封面" loading="lazy">`
          : `<div class="library-result-cover is-empty" aria-hidden="true">ECHO</div>`;
        return `
          <button class="library-result" type="button" role="option" data-library-index="${index}">
            ${cover}
            <span class="library-result-main">
              <span class="library-result-title">${escapeHtml(item.title || "未知歌曲")}</span>
              <span class="library-result-meta">${escapeHtml(libraryMeta(item))}</span>
            </span>
            <span class="library-result-action">收藏</span>
          </button>
        `;
      }).join("") + `<div class="library-load-marker" aria-live="polite">${escapeHtml(libraryScrollHintText())}</div>`;
      els.libraryResults.querySelectorAll("[data-library-index]").forEach((button) => {
        button.addEventListener("click", () => addLibraryFavorite(Number(button.dataset.libraryIndex)));
      });
    }

    function maybeLoadMoreLibraryResults() {
      if (els.libraryPicker.hidden || librarySearchBusy || !libraryHasMore) return;
      const nearBottom = els.libraryResults.scrollTop + els.libraryResults.clientHeight >= els.libraryResults.scrollHeight - 180;
      if (nearBottom) searchLibrary(librarySearchQuery, { append: true });
    }

    function maybeFillLibraryViewport() {
      window.setTimeout(() => {
        if (els.libraryPicker.hidden || librarySearchBusy || !libraryHasMore) return;
        if (els.libraryResults.scrollHeight <= els.libraryResults.clientHeight + 24) {
          searchLibrary(librarySearchQuery, { append: true });
        }
      }, 80);
    }

    async function searchLibrary(query = "", options = {}) {
      const append = Boolean(options.append);
      const reset = options.reset !== false && !append;
      if (librarySearchBusy && librarySearchAbort) {
        if (append) return;
        librarySearchAbort.abort();
      }
      const text = String(query || "").trim();
      if (reset) {
        librarySearchQuery = text;
        librarySearchOffset = 0;
        libraryHasMore = false;
        libraryBrowseSeed = Date.now() % 1000000;
        librarySearchResults = [];
        els.libraryResults.scrollTop = 0;
      }
      librarySearchBusy = true;
      const controller = new AbortController();
      librarySearchAbort = controller;
      renderLibraryResults();
      try {
        const offset = append ? librarySearchOffset : 0;
        const endpoint = text
          ? `/api/mainline/search?q=${encodeURIComponent(text)}&limit=${libraryPageSize}&offset=${offset}`
          : `/api/mainline/catalog?limit=${libraryPageSize}&offset=${offset}&random_seed=${encodeURIComponent(libraryBrowseSeed)}`;
        const response = await fetch(endpoint, { signal: controller.signal });
        if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
        const data = await response.json();
        const nextItems = (data.items || []).map((item, index) => normalizeItem(item, offset + index));
        librarySearchResults = append ? [...librarySearchResults, ...nextItems] : nextItems;
        const totalAvailable = Number(data.total_available || librarySearchResults.length);
        librarySearchOffset = Number(data.next_offset ?? (offset + nextItems.length));
        libraryHasMore = Boolean(data.has_more ?? (librarySearchOffset < totalAvailable));
        renderLibraryResults();
        maybeFillLibraryViewport();
      } catch (error) {
        if (error.name === "AbortError") return;
        console.error(error);
        if (!append) {
          librarySearchResults = [];
          libraryHasMore = false;
          librarySearchOffset = 0;
        }
        els.libraryResults.innerHTML = `<div class="library-status">曲库加载失败，请稍后再试</div>`;
      } finally {
        if (librarySearchAbort === controller) {
          librarySearchBusy = false;
          librarySearchAbort = null;
          renderLibraryResults();
        }
      }
    }

    function addLibraryFavorite(index) {
      const item = librarySearchResults[index];
      if (!item) return;
      window.EchoFavoriteStore?.add?.(item.raw || item);
      loadStoredFavorites();
      removedTrackIds.delete(itemKey(item));
      writeRemovedTrackIds();
      els.source.value = "favorite";
      renderCustomSelect(els.source);
      render();
      closeLibraryPicker();
    }

    async function importFiles(files) {
      const fileList = Array.from(files || []);
      const stamp = Date.now();
      const next = fileList.map((file, index) => {
        const title = file.name.replace(/\.[^.]+$/, "");
        const id = `upload_${stamp}_${index}`;
        return {
          id,
          localAudioId: id,
          title,
          artist: t("music.local.uploadArtist"),
          genre: "",
          culture: "",
          country: "",
          region: "",
          province: "",
          city: "",
          location: "",
          source: "upload",
          cover: "",
          url: "",
          description: "",
          fileName: file.name,
          fileType: file.type || "audio",
          fileSize: file.size || 0,
          lastModified: file.lastModified || 0,
          imported: true
        };
      });
      await Promise.all(next.map((item, index) => putLocalAudioRecord({
        id: item.localAudioId,
        title: item.title,
        artist: item.artist,
        genre: item.genre,
        culture: item.culture,
        source: item.source,
        fileName: item.fileName,
        fileType: item.fileType,
        fileSize: item.fileSize,
        lastModified: item.lastModified,
        blob: fileList[index]
      }).catch((error) => {
        console.warn("local audio save failed", error);
      })));
      imported = [...next, ...imported];
      els.source.value = "";
      renderCustomSelect(els.source);
      render();
    }

    function findVisibleItemByKey(key) {
      return [...imported, ...storedFavorites, ...catalog].find((item) => {
        return itemKey(item) === key || item.localAudioId === key;
      });
    }

    function playLocalImport(localAudioId) {
      const item = findVisibleItemByKey(localAudioId);
      if (!item) return;
      sessionStorage.setItem(pendingLocalPlayKey, JSON.stringify({
        id: item.localAudioId || itemKey(item),
        title: itemTitle(item),
        artist: itemArtist(item),
        genre: item.genre || "",
        culture: item.culture || "",
        source: item.source || "upload",
        fileName: item.fileName || "",
        fileType: item.fileType || "",
        fileSize: item.fileSize || 0,
        lastModified: item.lastModified || 0,
        fromFavorites: true
      }));
      window.location.href = `music.html?local=${encodeURIComponent(item.localAudioId || itemKey(item))}`;
    }

    function removeTrack(removeId) {
      if (!removeId) return;
      const current = [...imported, ...storedFavorites, ...catalog];
      const target = current.find((item) => itemKey(item) === removeId);
      imported = imported.filter((item) => itemKey(item) !== removeId);
      if (target?.favorite) {
        window.EchoFavoriteStore?.remove?.(target);
        loadStoredFavorites();
      }
      removedTrackIds.add(removeId);
      writeRemovedTrackIds();
      render();
    }

    function setupCustomSelect(select) {
      const control = select.closest(".control");
      if (!control || customSelects.has(select)) return;
      control.classList.add("select-control", "is-customized");

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "select-trigger";
      trigger.setAttribute("aria-haspopup", "listbox");
      trigger.setAttribute("aria-expanded", "false");
      trigger.innerHTML = `<span class="select-value"></span><span class="select-caret" aria-hidden="true">⌄</span>`;

      const menu = document.createElement("div");
      menu.className = "select-menu";
      menu.setAttribute("role", "listbox");

      select.insertAdjacentElement("afterend", trigger);
      trigger.insertAdjacentElement("afterend", menu);
      customSelects.set(select, { control, trigger, menu });

      trigger.addEventListener("click", () => {
        const shouldOpen = !control.classList.contains("is-open");
        closeCustomSelects(select);
        control.classList.toggle("is-open", shouldOpen);
        trigger.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
      });

      select.addEventListener("change", () => renderCustomSelect(select));
      renderCustomSelect(select);
    }

    function closeCustomSelects(except = null) {
      customSelects.forEach(({ control, trigger }, select) => {
        if (select === except) return;
        control.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      });
    }

    function renderCustomSelect(select) {
      const state = customSelects.get(select);
      if (!state) return;
      const { trigger, menu } = state;
      const valueText = trigger.querySelector(".select-value");
      const options = Array.from(select.options);
      const selected = options.find((option) => option.value === select.value) || options[0];
      valueText.textContent = selected ? selected.textContent : "";
      menu.innerHTML = options.map((option) => `
        <button
          class="select-option${option.value === select.value ? " is-selected" : ""}"
          type="button"
          role="option"
          aria-selected="${option.value === select.value ? "true" : "false"}"
          data-value="${escapeHtml(option.value)}"
        >${escapeHtml(option.textContent || "")}</button>
      `).join("");
      menu.querySelectorAll(".select-option").forEach((button) => {
        button.addEventListener("click", () => {
          select.value = button.dataset.value || "";
          closeCustomSelects();
          select.dispatchEvent(new Event("change", { bubbles: true }));
        });
      });
    }

    function refreshFilterOptions() {
      Array.from(els.source.options).forEach((option) => {
        const key = option.dataset.i18n;
        if (key) option.textContent = t(key);
      });
      Array.from(els.sort.options).forEach((option) => {
        const key = option.dataset.i18n;
        if (key) option.textContent = t(key);
      });
    }

    function setupCustomSelects() {
      refreshFilterOptions();
      [els.culture, els.source, els.sort].forEach(setupCustomSelect);
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".select-control")) closeCustomSelects();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeCustomSelects();
      });
    }

    els.search.addEventListener("input", render);
    [els.culture, els.source, els.sort].forEach((control) => {
      control.addEventListener("change", render);
    });
    els.importMenu.addEventListener("click", openImportPicker);
    els.importClose.addEventListener("click", closeImportPicker);
    els.importUploadChoice.addEventListener("click", () => {
      closeImportPicker();
      els.import.click();
    });
    els.importLibraryChoice.addEventListener("click", openLibraryPicker);
    els.importPicker.addEventListener("click", (event) => {
      if (event.target === els.importPicker) closeImportPicker();
    });
    els.libraryClose.addEventListener("click", closeLibraryPicker);
    els.libraryPicker.addEventListener("click", (event) => {
      if (event.target === els.libraryPicker) closeLibraryPicker();
    });
    els.librarySearchSubmit.addEventListener("click", () => searchLibrary(els.librarySearchInput.value, { reset: true }));
    els.librarySearchInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      searchLibrary(els.librarySearchInput.value, { reset: true });
    });
    els.libraryResults.addEventListener("scroll", maybeLoadMoreLibraryResults, { passive: true });
    els.import.addEventListener("change", (event) => {
      importFiles(event.target.files);
      event.target.value = "";
    });
    els.grid.addEventListener("click", (event) => {
      const removeButton = event.target.closest("[data-remove-id]");
      if (removeButton) {
        event.preventDefault();
        event.stopPropagation();
        removeTrack(removeButton.dataset.removeId);
        return;
      }
      const localPlay = event.target.closest("[data-local-play-id]");
      if (!localPlay) return;
      event.preventDefault();
      playLocalImport(localPlay.dataset.localPlayId);
    });
    window.addEventListener("resize", resizeMasonryItems);
    window.addEventListener("echo-favorites-change", () => {
      loadStoredFavorites();
      render();
    });
    window.addEventListener("echo-language-change", () => {
      loadStoredFavorites();
      populateCultures(catalog);
      refreshFilterOptions();
      [els.source, els.sort].forEach(renderCustomSelect);
      render();
    });
    window.addEventListener("storage", (event) => {
      if (event.key !== coverConfigKey) return;
      coverConfig = readCoverConfig();
      render();
    });
    window.addEventListener("echo-cover-settings-change", () => {
      coverConfig = readCoverConfig();
      render();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      closeImportPicker();
      closeLibraryPicker();
    });

    setupCustomSelects();
    loadCatalog().catch((error) => {
      console.error(error);
      loadStoredFavorites();
      if (storedFavorites.length) {
        populateCultures(storedFavorites);
        render();
        return;
      }
      els.grid.innerHTML = `<div class="empty-state">${escapeHtml(t("favorites.loadFailed"))}</div>`;
    });
  </script>
</body>
</html>
