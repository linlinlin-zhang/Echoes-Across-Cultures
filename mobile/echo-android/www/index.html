<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f7f5f0;
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      box-sizing: border-box;
      display: grid;
      min-height: 100%;
      place-items: center;
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 520;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: #54514b;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      border: 1px solid #111;
      border-radius: 999px;
      color: #111;
      text-decoration: none;
    }
  </style>
  <script>
    const target = "https://resonance.website/music.html";
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelector("a").href = target;
      window.location.replace(target);
    });
  </script>
</head>
<body>
  <main>
    <section>
      <h1>Echo</h1>
      <p>正在打开音乐台。</p>
      <a href="https://resonance.website/music.html">进入音乐台</a>
    </section>
  </main>
</body>
</html>
